name: Online Pipeline - Implement

# Starts when the spec PR (branch userspec/{slug}, label userspec-spec) merges, resumes when the
# user answers a decision question asked mid-implementation, continues a followup request while a
# round's code PR is still open, and classifies a comment that arrives after a round's code PR has
# merged (post-merge: Q&A / new round / finalize signal). See skills/online-pipeline/SKILL.md for
# the naming contract and per-stage agent instructions.

on:
  pull_request:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  route:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'userspec-spec')) ||
      (github.event_name == 'issue_comment' && github.event.comment.user.type != 'Bot' && github.event.issue.pull_request == null)
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.route.outputs.action }}
      slug: ${{ steps.route.outputs.slug }}
      issue_number: ${{ steps.route.outputs.issue_number }}
      active_branch: ${{ steps.route.outputs.active_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine stage
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_LABELS_JSON: ${{ toJSON(github.event.issue.labels.*.name) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            SLUG="${HEAD_REF#userspec/}"
            echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
            echo "issue_number=${SLUG##*-}" >> "$GITHUB_OUTPUT"
            echo "action=start" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SLUG="$(printf '%s' "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)-${ISSUE_NUMBER}"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

          # AC3: idempotency check comes first, before any label/branch check — a feature already
          # finalized never dispatches anything again, regardless of label/branch state (AC13).
          if [ -d "work/completed/$SLUG" ]; then
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # AC4: the merged-awaiting-followup label (set by online-pipeline-finalize.yml's
          # set-label job) takes priority over any branch/status check below — once it's present,
          # the round that just merged has no open branch/PR worth inspecting anymore; this comment
          # is classified by stage post-merge instead.
          if printf '%s' "$ISSUE_LABELS_JSON" | jq -e 'index("online-pipeline-merged-awaiting-followup") != null' >/dev/null; then
            echo "action=post-merge" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # AC14: "branch of the currently open round" is read from the active_branch marker in the
          # issue body, never re-derived by querying gh pr list — absent marker means round 1
          # (feature/{slug}), the only case stage implement itself ever creates without writing one.
          ISSUE_BODY="$(gh issue view "$ISSUE_NUMBER" --json body -q .body 2>/dev/null || true)"
          ACTIVE_BRANCH="$(printf '%s' "$ISSUE_BODY" | grep -oP '(?<=active_branch=)\S+' || true)"
          if [ -z "$ACTIVE_BRANCH" ]; then
            ACTIVE_BRANCH="feature/$SLUG"
          fi

          if ! git ls-remote --exit-code --heads origin "$ACTIVE_BRANCH" >/dev/null 2>&1; then
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "active_branch=$ACTIVE_BRANCH" >> "$GITHUB_OUTPUT"
          git fetch origin "$ACTIVE_BRANCH"
          git checkout "$ACTIVE_BRANCH"

          STATUS_FILE="work/$SLUG/logs/working/online-pipeline-status.yml"
          CURRENT_STATUS="$(grep -oP '(?<=^status: ).*' "$STATUS_FILE" 2>/dev/null || echo "")"

          if [ "$CURRENT_STATUS" = "awaiting_decision" ]; then
            echo "action=resume" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT_STATUS" = "ready_for_pr" ] && [ -n "$(gh pr list --head "$ACTIVE_BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)" ]; then
            # Code PR still OPEN and implementation already finished once — this comment is a new
            # change request on top of it, not an answer to a question (that's "resume" above).
            # Once the code PR merges, set-label sets the merged-awaiting-followup label and the
            # AC4 branch above takes over on the next comment instead of falling through here.
            echo "action=followup" >> "$GITHUB_OUTPUT"
          else
            echo "action=skip" >> "$GITHUB_OUTPUT"
          fi

  implement:
    needs: route
    if: needs.route.outputs.action == 'start' || needs.route.outputs.action == 'resume' || needs.route.outputs.action == 'followup' || needs.route.outputs.action == 'post-merge'
    runs-on: ubuntu-latest
    concurrency:
      group: online-pipeline-implement-${{ needs.route.outputs.slug }}
      # A new followup comment should pre-empt whatever else is running/queued for this slug
      # (start/resume/an earlier followup) to prioritize the latest request (AC5); a new comment
      # arriving while a prior post-merge classification is still running (AC8) does the same —
      # start/resume keep queuing as before, unchanged for those two actions.
      cancel-in-progress: ${{ needs.route.outputs.action == 'followup' || needs.route.outputs.action == 'post-merge' }}
    env:
      SLUG: ${{ needs.route.outputs.slug }}
      ISSUE_NUMBER: ${{ needs.route.outputs.issue_number }}
      ROUTE_ACTION: ${{ needs.route.outputs.action }}
      ROUTE_ACTIVE_BRANCH: ${{ needs.route.outputs.active_branch }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SLACK_RELAY_TOKEN: ${{ secrets.SLACK_RELAY_TOKEN }}
      SLACK_WORKER_URL: ${{ secrets.SLACK_WORKER_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The default GITHUB_TOKEN can never push a change under .github/workflows/* —
          # GitHub hard-blocks that for the Actions-issued token regardless of the permissions:
          # block above (confirmed in production: a real implementation that legitimately added
          # a CI workflow file got "refusing to allow a GitHub App to create or update workflow
          # ... without `workflows` permission" on every push, including this step's own "Open
          # the code PR" push, which silently swallowed the failure via `|| true` and opened a PR
          # with none of the actual work). GH_PAT (already used elsewhere in this pipeline, e.g.
          # the userspec-approve job's PR merge) must carry the `workflow` OAuth scope for this to
          # work; persisting it here means every later `git push` in this job — the agent's own,
          # and this workflow's — authenticates with it instead.
          token: ${{ secrets.GH_PAT }}

      - name: Prepare the feature branch
        run: |
          set -euo pipefail
          git config user.email "online-pipeline[bot]@users.noreply.github.com"
          git config user.name "online-pipeline[bot]"

          if [ "$ROUTE_ACTION" = "start" ]; then
            ACTIVE_BRANCH="feature/$SLUG"
            echo "IMPLEMENT_ACTION=start" >> "$GITHUB_ENV"
            echo "ACTIVE_BRANCH=$ACTIVE_BRANCH" >> "$GITHUB_ENV"
            git push origin "HEAD:refs/heads/$ACTIVE_BRANCH"
            git fetch origin "$ACTIVE_BRANCH"
            git checkout "$ACTIVE_BRANCH"
            mkdir -p "work/$SLUG/logs/working"
            printf 'status: in_progress\n' > "work/$SLUG/logs/working/online-pipeline-status.yml"

          elif [ "$ROUTE_ACTION" = "resume" ] || [ "$ROUTE_ACTION" = "followup" ]; then
            ACTIVE_BRANCH="$ROUTE_ACTIVE_BRANCH"
            echo "IMPLEMENT_ACTION=$ROUTE_ACTION" >> "$GITHUB_ENV"
            echo "ACTIVE_BRANCH=$ACTIVE_BRANCH" >> "$GITHUB_ENV"
            git fetch origin "$ACTIVE_BRANCH"
            git checkout "$ACTIVE_BRANCH"

            STATUS_FILE="work/$SLUG/logs/working/online-pipeline-status.yml"
            if [ "$ROUTE_ACTION" = "resume" ]; then
              # route decided "resume" from a snapshot taken before this job's own concurrency gate
              # (online-pipeline-implement-$SLUG) was acquired. If a second qualifying comment
              # queued up behind an in-flight resume for the same slug, that earlier run may have
              # already finished (or hit a later stop) by the time this one starts, making this
              # decision and its paired comment stale. Re-check the just-fetched branch state now,
              # post-gate, and skip rather than act on stale data.
              CURRENT_STATUS="$(grep -oP '(?<=^status: ).*' "$STATUS_FILE" 2>/dev/null || echo "")"
              if [ "$CURRENT_STATUS" != "awaiting_decision" ]; then
                echo "Resume request is stale (branch status is now '$CURRENT_STATUS', not awaiting_decision) — a prior queued run for this feature already handled it. Skipping."
                echo "STALE=true" >> "$GITHUB_ENV"
              fi
            elif [ "$ROUTE_ACTION" = "followup" ]; then
              # Same staleness problem as resume above, plus a second one specific to followup: by
              # the time this job gets its turn in the shared concurrency group, a run that was
              # ahead of it may have already committed a newer terminal status
              # (ready_for_pr/awaiting_decision from its own followup or decision), or the PR may
              # have merged while this job waited. Re-check both post-gate (AC8) and skip rather
              # than act on stale data.
              CURRENT_STATUS="$(grep -oP '(?<=^status: ).*' "$STATUS_FILE" 2>/dev/null || echo "")"
              EXISTING_PR="$(gh pr list --head "$ACTIVE_BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)"
              if [ "$CURRENT_STATUS" != "ready_for_pr" ] || [ -z "$EXISTING_PR" ]; then
                echo "Followup request is stale (branch status is now '$CURRENT_STATUS', PR open: $([ -n "$EXISTING_PR" ] && echo yes || echo no)) — a newer run already handled this feature, or its PR merged while this job waited. Skipping."
                echo "STALE=true" >> "$GITHUB_ENV"
              fi
            fi
            mkdir -p "work/$SLUG/logs/working"
            printf 'status: in_progress\n' > "$STATUS_FILE"

          else
            # post-merge: nothing to check out yet — stay on the default branch (main). The
            # "Classify post-merge comment and prepare round" step below handles everything,
            # including setting IMPLEMENT_ACTION/ACTIVE_BRANCH itself if it creates a new round.
            echo "IMPLEMENT_ACTION=" >> "$GITHUB_ENV"
            echo "ACTIVE_BRANCH=" >> "$GITHUB_ENV"
          fi

      - name: Select Claude auth method
        if: env.STALE != 'true'
        run: |
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "Using Claude subscription OAuth token"
          elif [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "Using Anthropic API key"
          else
            echo "::error::Set either CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as a repo secret"
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: env.STALE != 'true'
        with:
          node-version: "20"

      - name: Install Claude Code
        if: env.STALE != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Classify post-merge comment and prepare round
        if: env.STALE != 'true' && env.ROUTE_ACTION == 'post-merge'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          relay_to_slack() {
            local issue_number="$1" text="$2"
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 0
            fi
            local issue_body channel_id thread_ts
            issue_body="$(gh issue view "$issue_number" --json body -q .body)"
            channel_id="$(printf '%s' "$issue_body" | grep -oP '(?<=channel_id=)\S+' || true)"
            thread_ts="$(printf '%s' "$issue_body" | grep -oP '(?<=thread_ts=)\S+' || true)"
            if [ -z "$channel_id" ]; then
              return 0
            fi
            curl -fsS -X POST "$SLACK_WORKER_URL/relay" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg c "$channel_id" --arg t "$thread_ts" --arg x "$text" \
                    '{channel_id:$c, thread_ts:$t, text:$x}')" || true
          }

          # Same rate-limit auto-switch as "Implement with retry" below (see SKILL.md) — this
          # call site was originally left out as a plain ATTEMPTS=3 retry (a one-word
          # classification seemed low-value enough to skip the pool-switch machinery), but a real
          # session-limit hit during rollout showed that skipping it just means stage post-merge
          # fails more often than its neighbors right when CI usage is heaviest (immediately after
          # an implement round). Added for consistency with every other claude -p call in this file.
          try_rate_limit_switch() {
            if ! grep -qF "You've hit your session limit" "$CLAUDE_OUTPUT_FILE" \
               && ! grep -qF "You've hit your weekly limit" "$CLAUDE_OUTPUT_FILE"; then
              return 1
            fi
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 1
            fi
            local reset_text resp ok err
            reset_text="$(grep -oP "resets .*\)" "$CLAUDE_OUTPUT_FILE" | tail -1 || true)"
            resp="$(curl -fsS -X POST "$SLACK_WORKER_URL/switch-token/auto" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg o "${GITHUB_REPOSITORY%%/*}" --arg r "${GITHUB_REPOSITORY##*/}" --arg t "$reset_text" \
                    '{owner:$o, repo:$r, rateLimitResetText:$t}')" 2>/dev/null || true)"
            ok="$(printf '%s' "$resp" | jq -r '.ok // false' 2>/dev/null || echo false)"
            if [ "$ok" = "true" ]; then
              CURRENT_TOKEN="$(printf '%s' "$resp" | jq -r '.token')"
              echo "Rate limit detected — switched to pool alias $(printf '%s' "$resp" | jq -r '.alias')."
              return 0
            fi
            err="$(printf '%s' "$resp" | jq -r '.error // ""' 2>/dev/null || echo "")"
            if [ "$err" = "no_alias_available" ]; then
              SWITCH_EXHAUSTED=true
            fi
            return 1
          }

          DECISION_FILE="$(mktemp)"
          ATTEMPTS=3
          RESULT="technical_error"
          DECISION=""
          CURRENT_TOKEN="${CLAUDE_CODE_OAUTH_TOKEN:-}"
          RATE_LIMIT_RESUME_COUNT=0
          BEFORE_COMMENT_COUNT="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments | length')"

          for ATTEMPT in 1 2 3; do
            echo "Post-merge classify attempt $ATTEMPT/$ATTEMPTS"
            rm -f "$DECISION_FILE"

            PROMPT="Use the online-pipeline skill (.claude/skills/online-pipeline/SKILL.md), stage \"post-merge\".
          Issue: #$ISSUE_NUMBER
          Feature slug: $SLUG
          Feature folder: work/$SLUG
          Decision file: $DECISION_FILE

          Latest issue comment (classify this):
          $COMMENT_BODY"
            CLAUDE_FLAGS=(-p)
            CLAUDE_PROMPT_TEXT="$PROMPT"

            while true; do
              CLAUDE_OUTPUT_FILE="$(mktemp)"
              set +e
              CLAUDE_CODE_OAUTH_TOKEN="$CURRENT_TOKEN" SLACK_RELAY_TOKEN="" SLACK_WORKER_URL="" \
                claude "${CLAUDE_FLAGS[@]}" "$CLAUDE_PROMPT_TEXT" --dangerously-skip-permissions 2>&1 | tee "$CLAUDE_OUTPUT_FILE"
              set -e

              AFTER_COMMENT_COUNT="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments | length')"
              if [ "$AFTER_COMMENT_COUNT" -gt "$BEFORE_COMMENT_COUNT" ]; then
                while IFS= read -r COMMENT_JSON; do
                  COMMENT_TEXT="$(printf '%s' "$COMMENT_JSON" | jq -r '.')"
                  relay_to_slack "$ISSUE_NUMBER" "$COMMENT_TEXT"
                done < <(gh issue view "$ISSUE_NUMBER" --json comments --jq ".comments[$BEFORE_COMMENT_COUNT:]" \
                          | jq -c '.[] | select(.author.login == "github-actions") | .body')
              fi
              BEFORE_COMMENT_COUNT="$AFTER_COMMENT_COUNT"

              DECISION="$(tr -d '[:space:]' < "$DECISION_FILE" 2>/dev/null || true)"
              if [ "$DECISION" = "qa" ] || [ "$DECISION" = "followup" ] || [ "$DECISION" = "finalize" ]; then
                RESULT="success"
                break 2
              fi

              echo "Technical failure on attempt $ATTEMPT (decision file content: '$DECISION')."
              if try_rate_limit_switch; then
                RATE_LIMIT_RESUME_COUNT=$((RATE_LIMIT_RESUME_COUNT + 1))
                echo "Rate-limit resume #$RATE_LIMIT_RESUME_COUNT — continuing previous session with new token"
                CLAUDE_FLAGS=(-p -c)
                CLAUDE_PROMPT_TEXT="Your Claude Code token was refreshed after a rate limit. Continue exactly where you left off — finish classifying and write the decision file exactly as instructed."
                continue
              elif [ "${SWITCH_EXHAUSTED:-false}" = "true" ]; then
                RESULT="rate_limit_pool_exhausted"
                break 2
              fi
              break
            done
          done

          if [ "$RESULT" = "rate_limit_pool_exhausted" ]; then
            echo "RESULT=rate_limit_pool_exhausted" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$RESULT" != "success" ]; then
            echo "RESULT=technical_error" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$DECISION" = "qa" ]; then
            # Agent already posted its own short reply comment (see SKILL.md stage post-merge) —
            # nothing else to do: no branch/PR, no label change, no code-writing (AC5).
            echo "RESULT=success" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$DECISION" = "finalize" ]; then
            DISPATCH_OK=false
            for ATTEMPT in 1 2 3; do
              if gh workflow run online-pipeline-finalize.yml -f slug="$SLUG" -f issue_number="$ISSUE_NUMBER"; then
                DISPATCH_OK=true
                break
              fi
              echo "gh workflow run failed on attempt $ATTEMPT."
            done
            if [ "$DISPATCH_OK" = "true" ]; then
              echo "RESULT=success" >> "$GITHUB_ENV"
            else
              echo "RESULT=technical_error" >> "$GITHUB_ENV"
            fi
            exit 0
          fi

          # DECISION = "followup": compute N (AC6) — round 1, with no prefix, always counts, so the
          # first follow-up always yields round 2 — create the new round branch from main (empty,
          # zero commits yet — exactly like ROUTE_ACTION=start's own branch creation) and write the
          # active_branch marker. PR creation is deliberately NOT done here: GitHub refuses to open
          # a PR with no diff between branches ("No commits between main and feature/r{N}-..."),
          # the same reason stage `implement`'s own "start" path never opens round 1's PR until
          # after code-writing's first commit either — it is deferred to the existing "Open the
          # code PR" step below (gated on IMPLEMENT_ACTION == 'start', which this branch sets),
          # which runs once "Implement with retry" actually has something to push. Only once
          # branch+marker succeed is the merged-awaiting-followup label removed (Constraints: never
          # remove it before a new round is fully in place) — "PR" in that Constraint is satisfied
          # by the same deferred-creation guarantee round 1 already relies on, not a literal
          # precondition GitHub's API can satisfy at this exact point.
          EXISTING_ROUNDS="$(gh pr list --state all --limit 1000 --json headRefName -q '.[].headRefName' \
            | grep -cE "^feature/(r[0-9]+-)?${SLUG}\$" || true)"
          N=$((EXISTING_ROUNDS + 1))
          NEW_BRANCH="feature/r${N}-${SLUG}"

          if git checkout -b "$NEW_BRANCH" && git push origin "HEAD:refs/heads/$NEW_BRANCH"; then
            ISSUE_BODY="$(gh issue view "$ISSUE_NUMBER" --json body -q .body)"
            NEW_BODY="$(printf '%s\n' "$ISSUE_BODY" | grep -v '<!-- online-pipeline: active_branch=' || true)"
            if printf '%s\n\n<!-- online-pipeline: active_branch=%s -->\n' "$NEW_BODY" "$NEW_BRANCH" | gh issue edit "$ISSUE_NUMBER" --body-file -; then
              LABEL_REMOVED=false
              for ATTEMPT in 1 2 3; do
                if gh issue edit "$ISSUE_NUMBER" --remove-label online-pipeline-merged-awaiting-followup; then
                  LABEL_REMOVED=true
                  break
                fi
              done
              if [ "$LABEL_REMOVED" != "true" ]; then
                WARN_MESSAGE="Round $N đã tạo xong (branch $NEW_BRANCH) nhưng không gỡ được label online-pipeline-merged-awaiting-followup sau 3 lần thử — vui lòng gỡ label này bằng tay trên GitHub để route job không hiểu nhầm comment tiếp theo."
                gh issue comment "$ISSUE_NUMBER" --body "$WARN_MESSAGE" || true
                relay_to_slack "$ISSUE_NUMBER" "$WARN_MESSAGE"
              fi
              echo "IMPLEMENT_ACTION=start" >> "$GITHUB_ENV"
              echo "ACTIVE_BRANCH=$NEW_BRANCH" >> "$GITHUB_ENV"
              mkdir -p "work/$SLUG/logs/working"
              printf 'status: in_progress\n' > "work/$SLUG/logs/working/online-pipeline-status.yml"
              echo "RESULT=success" >> "$GITHUB_ENV"
            else
              echo "RESULT=technical_error" >> "$GITHUB_ENV"
            fi
          else
            echo "RESULT=technical_error" >> "$GITHUB_ENV"
          fi

      - name: Implement with retry
        if: env.STALE != 'true' && env.IMPLEMENT_ACTION != '' && env.RESULT != 'technical_error'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          relay_to_slack() {
            local issue_number="$1" text="$2"
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 0
            fi
            local issue_body channel_id thread_ts
            issue_body="$(gh issue view "$issue_number" --json body -q .body)"
            channel_id="$(printf '%s' "$issue_body" | grep -oP '(?<=channel_id=)\S+' || true)"
            thread_ts="$(printf '%s' "$issue_body" | grep -oP '(?<=thread_ts=)\S+' || true)"
            if [ -z "$channel_id" ]; then
              return 0
            fi
            curl -fsS -X POST "$SLACK_WORKER_URL/relay" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg c "$channel_id" --arg t "$thread_ts" --arg x "$text" \
                    '{channel_id:$c, thread_ts:$t, text:$x}')" || true
          }

          # Rate-limit auto-switch (control-plane token pool). Reads CLAUDE_OUTPUT_FILE (set by the
          # caller for the attempt just run). Only the two fixed, confirmed-real prefixes are
          # matched (Risk 1) — a GitHub wording change or any other error never false-positives
          # here, and this function then just returns 1 with SWITCH_EXHAUSTED unset, which the
          # caller treats exactly like any other technical failure (retry-same-token). On success
          # it updates CURRENT_TOKEN; on {ok:false, error:"no_alias_available"} it sets
          # SWITCH_EXHAUSTED=true so the caller stops the loop instead of burning the remaining
          # attempts on a token known to still be rate-limited.
          try_rate_limit_switch() {
            if ! grep -qF "You've hit your session limit" "$CLAUDE_OUTPUT_FILE" \
               && ! grep -qF "You've hit your weekly limit" "$CLAUDE_OUTPUT_FILE"; then
              return 1
            fi
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 1
            fi
            local reset_text resp ok err
            reset_text="$(grep -oP "resets .*\)" "$CLAUDE_OUTPUT_FILE" | tail -1 || true)"
            resp="$(curl -fsS -X POST "$SLACK_WORKER_URL/switch-token/auto" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg o "${GITHUB_REPOSITORY%%/*}" --arg r "${GITHUB_REPOSITORY##*/}" --arg t "$reset_text" \
                    '{owner:$o, repo:$r, rateLimitResetText:$t}')" 2>/dev/null || true)"
            ok="$(printf '%s' "$resp" | jq -r '.ok // false' 2>/dev/null || echo false)"
            if [ "$ok" = "true" ]; then
              CURRENT_TOKEN="$(printf '%s' "$resp" | jq -r '.token')"
              echo "Rate limit detected — switched to pool alias $(printf '%s' "$resp" | jq -r '.alias')."
              return 0
            fi
            err="$(printf '%s' "$resp" | jq -r '.error // ""' 2>/dev/null || echo "")"
            if [ "$err" = "no_alias_available" ]; then
              SWITCH_EXHAUSTED=true
            fi
            return 1
          }

          STAGE_NAME="implement"
          if [ "$IMPLEMENT_ACTION" = "resume" ]; then
            STAGE_NAME="implement-resume"
          elif [ "$IMPLEMENT_ACTION" = "followup" ]; then
            STAGE_NAME="implement-followup"
          fi

          STATUS_FILE="work/$SLUG/logs/working/online-pipeline-status.yml"
          LAST_GOOD="$(git rev-parse HEAD)"
          ATTEMPTS=3
          RESULT="technical_error"
          CURRENT_TOKEN="${CLAUDE_CODE_OAUTH_TOKEN:-}"
          # Comment count, not status-file state — relaying is about mirroring gh issue comment
          # calls to Slack, independent of why the agent made them. The agent itself never calls
          # relay_to_slack anymore (see SKILL.md, Stage implement/implement-resume step 2) — in
          # production it sometimes posted the comment but skipped its own relay reproduction, so
          # this loop mirrors every new bot comment deterministically instead.
          BEFORE_COMMENT_COUNT="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments | length')"
          RATE_LIMIT_RESUME_COUNT=0

          for ATTEMPT in 1 2 3; do
            echo "Implement attempt $ATTEMPT/$ATTEMPTS (stage: $STAGE_NAME)"

            PROMPT_FILE="$(mktemp)"
            {
              echo "Use the online-pipeline skill (.claude/skills/online-pipeline/SKILL.md), stage \"$STAGE_NAME\"."
              echo "Issue: #$ISSUE_NUMBER"
              echo "Feature slug: $SLUG"
              echo "Feature folder: work/$SLUG"
              echo "Branch: $ACTIVE_BRANCH"
              if [ "$STAGE_NAME" = "implement-resume" ]; then
                echo ""
                echo "Latest issue comment (answer to the question you asked last time):"
                echo "$COMMENT_BODY"
              elif [ "$STAGE_NAME" = "implement-followup" ]; then
                echo ""
                echo "Latest issue comment (a NEW code-change request on the already-open PR — not an answer to a prior question):"
                echo "$COMMENT_BODY"
              elif [ "$ROUTE_ACTION" = "post-merge" ]; then
                echo ""
                echo "Latest issue comment (the follow-up request for this new round — read work/$SLUG/user-spec.md and decisions.md for full context; do not re-run the interview):"
                echo "$COMMENT_BODY"
              fi
            } > "$PROMPT_FILE"
            CLAUDE_FLAGS=(-p)
            CLAUDE_PROMPT_TEXT="$(cat "$PROMPT_FILE")"

            # Inner loop: a rate-limit mid-attempt swaps CURRENT_TOKEN and continues the exact same
            # Claude Code session with -c/--continue instead of falling through to the outer loop's
            # reset-and-retry-from-scratch below — this is "rate-limit resume" (see SKILL.md),
            # distinct from the pre-existing "resume"/implement-resume stage. It never advances
            # ATTEMPT and never touches git; only a genuine (non-rate-limit) technical failure —
            # including the resume call itself failing for a reason other than rate-limit — breaks
            # out to the outer loop's existing reset-and-retry handling.
            while true; do
              CLAUDE_OUTPUT_FILE="$(mktemp)"
              set +e
              # SLACK_RELAY_TOKEN/SLACK_WORKER_URL deliberately blanked for this child process only
              # (the surrounding shell keeps the real values for the deterministic relay below) —
              # the agent must never self-relay (see SKILL.md), and a prose instruction alone proved
              # insufficient to guarantee that in production: this makes any self-relay attempt a
              # harmless no-op/401 instead of a real duplicate Slack post.
              CLAUDE_CODE_OAUTH_TOKEN="$CURRENT_TOKEN" SLACK_RELAY_TOKEN="" SLACK_WORKER_URL="" \
                claude "${CLAUDE_FLAGS[@]}" "$CLAUDE_PROMPT_TEXT" --dangerously-skip-permissions 2>&1 | tee "$CLAUDE_OUTPUT_FILE"
              set -e

              AFTER_COMMENT_COUNT="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments | length')"
              if [ "$AFTER_COMMENT_COUNT" -gt "$BEFORE_COMMENT_COUNT" ]; then
                RELAY_COUNT=0
                while IFS= read -r COMMENT_JSON; do
                  COMMENT_TEXT="$(printf '%s' "$COMMENT_JSON" | jq -r '.')"
                  relay_to_slack "$ISSUE_NUMBER" "$COMMENT_TEXT"
                  RELAY_COUNT=$((RELAY_COUNT + 1))
                done < <(gh issue view "$ISSUE_NUMBER" --json comments --jq ".comments[$BEFORE_COMMENT_COUNT:]" \
                          | jq -c '.[] | select(.author.login == "github-actions") | .body')
                echo "Relayed $RELAY_COUNT new bot comment(s) to Slack ($((AFTER_COMMENT_COUNT - BEFORE_COMMENT_COUNT)) new comment(s) total)."
              fi
              BEFORE_COMMENT_COUNT="$AFTER_COMMENT_COUNT"

              STATUS="$(grep -oP '(?<=^status: ).*' "$STATUS_FILE" 2>/dev/null || echo in_progress)"

              if [ "$STATUS" = "ready_for_pr" ]; then
                RESULT="success"
                break 2
              fi
              if [ "$STATUS" = "awaiting_decision" ]; then
                RESULT="awaiting_decision"
                break 2
              fi

              echo "Technical failure (status: $STATUS)."
              if try_rate_limit_switch; then
                RATE_LIMIT_RESUME_COUNT=$((RATE_LIMIT_RESUME_COUNT + 1))
                echo "Rate-limit resume #$RATE_LIMIT_RESUME_COUNT — continuing previous session with new token"
                CLAUDE_FLAGS=(-p -c)
                CLAUDE_PROMPT_TEXT="Your Claude Code token was refreshed after a rate limit. Continue exactly where you left off on this same task — do not restart from the beginning."
                continue
              elif [ "${SWITCH_EXHAUSTED:-false}" = "true" ]; then
                RESULT="rate_limit_pool_exhausted"
                break 2
              fi
              break
            done

            if [ "$ATTEMPT" -lt "$ATTEMPTS" ]; then
              git push --force origin "$LAST_GOOD:refs/heads/$ACTIVE_BRANCH"
              git reset --hard "$LAST_GOOD"
              git clean -fd
            fi
          done

          echo "RESULT=$RESULT" >> "$GITHUB_ENV"
          # Baseline commit this job started from (never reassigned above, even across retries —
          # a reset-and-retry force-pushes back to this exact same SHA). "Push followup commit and
          # confirm" below uses it to tell a real code change apart from the AC6 case (comment
          # wasn't a real request, agent replied directly and made no commit) without needing a new
          # status-marker value.
          echo "FOLLOWUP_BASELINE_SHA=$LAST_GOOD" >> "$GITHUB_ENV"

      - name: Open the code PR
        if: env.RESULT == 'success' && (env.IMPLEMENT_ACTION == 'start' || env.IMPLEMENT_ACTION == 'resume')
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$ACTIVE_BRANCH" || true
          EXISTING="$(gh pr list --head "$ACTIVE_BRANCH" --state open --json number -q '.[0].number' || true)"
          if [ -z "$EXISTING" ]; then
            gh label list --json name -q '.[].name' | grep -qx userspec-implement || gh label create userspec-implement --description "online-pipeline" --color "1D76DB"
            gh pr create --base main --head "$ACTIVE_BRANCH" \
              --title "feature: $SLUG" \
              --body "Auto-generated by online-pipeline from work/$SLUG/user-spec.md. Review and merge to continue." \
              --label userspec-implement
          fi

      - name: Push followup commit and confirm
        if: env.RESULT == 'success' && env.IMPLEMENT_ACTION == 'followup'
        run: |
          set -euo pipefail

          relay_to_slack() {
            local issue_number="$1" text="$2"
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 0
            fi
            local issue_body channel_id thread_ts
            issue_body="$(gh issue view "$issue_number" --json body -q .body)"
            channel_id="$(printf '%s' "$issue_body" | grep -oP '(?<=channel_id=)\S+' || true)"
            thread_ts="$(printf '%s' "$issue_body" | grep -oP '(?<=thread_ts=)\S+' || true)"
            if [ -z "$channel_id" ]; then
              return 0
            fi
            curl -fsS -X POST "$SLACK_WORKER_URL/relay" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg c "$channel_id" --arg t "$thread_ts" --arg x "$text" \
                    '{channel_id:$c, thread_ts:$t, text:$x}')" || true
          }

          if [ "$(git rev-parse HEAD)" = "$FOLLOWUP_BASELINE_SHA" ]; then
            # Agent decided the comment wasn't a real code-change request (AC6) and made no commit
            # — it already posted its own short reply comment directly, status stayed ready_for_pr.
            # Nothing to push and no generic "PR updated" confirmation to post here.
            echo "No new commit from this followup run — comment was not a real change request (AC6). Skipping push and confirmation."
            exit 0
          fi

          # Deliberately not `|| true` here (unlike "Open the code PR" above, where that pattern is
          # safe only because the agent already pushed its own commit and this redundant push is
          # expected to be a no-op): the confirmation comment below must be posted only when the
          # push genuinely landed on origin (AC3). A real push failure here is a technical error,
          # not a signal to post a false confirmation — report it the same way the existing
          # ATTEMPTS-retry failure path does (see "Report technical failure" below) instead.
          if git push origin "HEAD:refs/heads/$ACTIVE_BRANCH"; then
            MESSAGE="Đã cập nhật PR $ACTIVE_BRANCH theo yêu cầu follow-up mới nhất."
            gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"
            relay_to_slack "$ISSUE_NUMBER" "$MESSAGE"
          else
            echo "Followup push failed — treating as a technical error, not posting a confirmation comment."
            echo "RESULT=technical_error" >> "$GITHUB_ENV"
          fi

      - name: Report technical failure
        if: env.RESULT == 'technical_error'
        run: |
          relay_to_slack() {
            local issue_number="$1" text="$2"
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 0
            fi
            local issue_body channel_id thread_ts
            issue_body="$(gh issue view "$issue_number" --json body -q .body)"
            channel_id="$(printf '%s' "$issue_body" | grep -oP '(?<=channel_id=)\S+' || true)"
            thread_ts="$(printf '%s' "$issue_body" | grep -oP '(?<=thread_ts=)\S+' || true)"
            if [ -z "$channel_id" ]; then
              return 0
            fi
            curl -fsS -X POST "$SLACK_WORKER_URL/relay" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg c "$channel_id" --arg t "$thread_ts" --arg x "$text" \
                    '{channel_id:$c, thread_ts:$t, text:$x}')" || true
          }
          MESSAGE="Implement job failed after 3 attempts (2 retries). Check the Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"
          relay_to_slack "$ISSUE_NUMBER" "$MESSAGE"
          exit 1

      - name: Report rate-limit pool exhausted
        if: env.RESULT == 'rate_limit_pool_exhausted'
        run: |
          relay_to_slack() {
            local issue_number="$1" text="$2"
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 0
            fi
            local issue_body channel_id thread_ts
            issue_body="$(gh issue view "$issue_number" --json body -q .body)"
            channel_id="$(printf '%s' "$issue_body" | grep -oP '(?<=channel_id=)\S+' || true)"
            thread_ts="$(printf '%s' "$issue_body" | grep -oP '(?<=thread_ts=)\S+' || true)"
            if [ -z "$channel_id" ]; then
              return 0
            fi
            curl -fsS -X POST "$SLACK_WORKER_URL/relay" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg c "$channel_id" --arg t "$thread_ts" --arg x "$text" \
                    '{channel_id:$c, thread_ts:$t, text:$x}')" || true
          }
          MESSAGE="Mọi token trong pool đều đang bị rate-limit, dừng tự động — thêm token mới qua /add-token hoặc đợi reset. Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"
          relay_to_slack "$ISSUE_NUMBER" "$MESSAGE"
          exit 1
