name: Online Pipeline - Finalize

# Two independent jobs sharing one workflow file:
# - set-label: fires on every code PR (branch feature/{slug} or feature/r{N}-{slug}, label
#   userspec-implement) merge. Pure bash, no claude -p — marks the issue "merged, awaiting
#   followup" via label. The issue stays open; no finalize logic runs here.
# - finalize: fires on workflow_dispatch (slug + issue_number inputs), once
#   online-pipeline-implement.yml's post-merge stage decides the user signaled "done". Commits
#   straight to main (no branch of its own) via documentation-writing's Feature Finalization Mode,
#   then closes the issue.
# See skills/online-pipeline/SKILL.md for the naming contract and per-stage agent instructions.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      slug:
        description: "Feature slug"
        required: true
        type: string
      issue_number:
        description: "Issue number"
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  set-label:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'userspec-implement')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No actions/checkout in this job (pure label bookkeeping, no file access needed) — gh
      # normally infers owner/repo from the local git remote, which doesn't exist without a
      # checkout, so every gh call fails with "fatal: not a git repository" unless GH_REPO is set
      # explicitly instead.
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      SLACK_RELAY_TOKEN: ${{ secrets.SLACK_RELAY_TOKEN }}
      SLACK_WORKER_URL: ${{ secrets.SLACK_WORKER_URL }}
    steps:
      - name: Set the merged-awaiting-followup label with retry
        run: |
          set -euo pipefail
          # The trailing segment after the last "-" is always the issue number (Naming Contract),
          # unaffected by the optional round-N prefix "r{N}-" (that prefix sits at the START of the
          # branch name, never at the end).
          BRANCH_SUFFIX="${HEAD_REF#feature/}"
          ISSUE_NUMBER="${BRANCH_SUFFIX##*-}"

          relay_to_slack() {
            local issue_number="$1" text="$2"
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 0
            fi
            local issue_body channel_id thread_ts
            issue_body="$(gh issue view "$issue_number" --json body -q .body)"
            channel_id="$(printf '%s' "$issue_body" | grep -oP '(?<=channel_id=)\S+' || true)"
            thread_ts="$(printf '%s' "$issue_body" | grep -oP '(?<=thread_ts=)\S+' || true)"
            if [ -z "$channel_id" ]; then
              return 0
            fi
            curl -fsS -X POST "$SLACK_WORKER_URL/relay" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg c "$channel_id" --arg t "$thread_ts" --arg x "$text" \
                    '{channel_id:$c, thread_ts:$t, text:$x}')" || true
          }

          ATTEMPTS=3
          OK=false
          for ATTEMPT in 1 2 3; do
            echo "Set-label attempt $ATTEMPT/$ATTEMPTS"
            if gh label list --json name -q '.[].name' | grep -qx online-pipeline-merged-awaiting-followup \
               || gh label create online-pipeline-merged-awaiting-followup --description "online-pipeline" --color "E99695"; then
              if gh issue edit "$ISSUE_NUMBER" --add-label online-pipeline-merged-awaiting-followup; then
                OK=true
                break
              fi
            fi
            echo "Technical failure on attempt $ATTEMPT."
          done

          if [ "$OK" != "true" ]; then
            MESSAGE="Lỗi kỹ thuật: không thể gắn label online-pipeline-merged-awaiting-followup sau $ATTEMPTS lần thử. Issue tạm thời không nhận followup tiếp qua comment — vui lòng báo người phụ trách kiểm tra Actions log."
            gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE" || true
            relay_to_slack "$ISSUE_NUMBER" "$MESSAGE"
            exit 1
          fi

  finalize:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      # Fixed, shared across every feature (and with knowledge-init) so two runs that both commit
      # straight to main never race on Project Knowledge. Deliberately NOT slug-scoped — this job
      # does not join online-pipeline-implement-{slug} like every implement round does; see
      # SKILL.md Naming Contract / Accepted Decisions for why.
      group: online-pipeline-finalize
      cancel-in-progress: false
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The very first step below runs before actions/checkout, so gh has no local git repo yet
      # to infer owner/repo from — GH_REPO makes every gh call in this job explicit instead.
      GH_REPO: ${{ github.repository }}
      SLUG: ${{ github.event.inputs.slug }}
      ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
      SLACK_RELAY_TOKEN: ${{ secrets.SLACK_RELAY_TOKEN }}
      SLACK_WORKER_URL: ${{ secrets.SLACK_WORKER_URL }}
    steps:
      - name: Remove the merged-awaiting-followup label (lock)
        # Done as the very first action — before checkout, before the idempotency check, before
        # documentation-writing runs — so it acts as a lock: from this point on,
        # online-pipeline-implement.yml's route job (AC4) has no label left to dispatch another
        # post-merge action for this slug while finalize is running (Risk 6).
        run: gh issue edit "$ISSUE_NUMBER" --remove-label online-pipeline-merged-awaiting-followup || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Check idempotency
        id: slug
        run: |
          set -euo pipefail
          if [ -d "work/completed/$SLUG" ]; then
            echo "already_done=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Claude auth method
        if: steps.slug.outputs.already_done == 'false'
        run: |
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "Using Claude subscription OAuth token"
          elif [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "Using Anthropic API key"
          else
            echo "::error::Set either CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as a repo secret"
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.slug.outputs.already_done == 'false'
        with:
          node-version: "20"

      - name: Install Claude Code
        if: steps.slug.outputs.already_done == 'false'
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Codex sync tooling
        if: steps.slug.outputs.already_done == 'false'
        # documentation-writing's Feature Finalization Mode runs ~/.claude/scripts/sync-to-codex.sh
        # whenever it updates Project Knowledge under .claude/** (the normal finalize path, not an
        # edge case) — that script only exists on a developer's own machine, never on a bare CI
        # runner, so it must be fetched here the same way the Claude CLI itself is installed fresh
        # each run. Only python3 is required (preinstalled on ubuntu-latest); no other dependency.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.claude/scripts"
          curl -fsSL -o "$HOME/.claude/scripts/sync-to-codex.py" \
            https://raw.githubusercontent.com/thanhpd56/molyanov-ai-dev/main/scripts/sync-to-codex.py
          curl -fsSL -o "$HOME/.claude/scripts/sync-to-codex.sh" \
            https://raw.githubusercontent.com/thanhpd56/molyanov-ai-dev/main/scripts/sync-to-codex.sh
          chmod +x "$HOME/.claude/scripts/sync-to-codex.sh"

      - name: Finalize with retry
        if: steps.slug.outputs.already_done == 'false'
        run: |
          set -euo pipefail
          git config user.email "online-pipeline[bot]@users.noreply.github.com"
          git config user.name "online-pipeline[bot]"

          ATTEMPTS=3
          RESULT="technical_error"

          for ATTEMPT in 1 2 3; do
            echo "Finalize attempt $ATTEMPT/$ATTEMPTS"

            if [ -d "work/completed/$SLUG" ]; then
              RESULT="success"
              break
            fi

            PROMPT="Use the online-pipeline skill (.claude/skills/online-pipeline/SKILL.md), stage \"finalize\".
          Issue: #$ISSUE_NUMBER
          Feature slug: $SLUG
          Feature folder: work/$SLUG
          ONLINE_PIPELINE_AUTOMATED"

            set +e
            claude -p "$PROMPT" --dangerously-skip-permissions
            set -e

            if [ -d "work/completed/$SLUG" ]; then
              RESULT="success"
              break
            fi

            echo "Technical failure on attempt $ATTEMPT."
            if [ "$ATTEMPT" -lt "$ATTEMPTS" ]; then
              # main is never reset here: a failure before the final commit leaves main untouched,
              # so a fresh checkout is enough. Only this job's own local state is discarded.
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
            fi
          done

          echo "RESULT=$RESULT" >> "$GITHUB_ENV"

      - name: Post completion comment, close issue, and relay
        # AC11 adds a real gh issue comment on the success path (there used to be none — the issue
        # was simply archived — which is why an earlier version of this step relayed a Slack-only
        # "✅ Feature xong" with no GitHub equivalent). Now that a real comment exists, relay that
        # same comment deterministically like every other mirror point instead of keeping a
        # separate Slack-only message.
        if: steps.slug.outputs.already_done == 'false' && env.RESULT == 'success'
        run: |
          set -euo pipefail
          MESSAGE="Đã hoàn tất feature này — Project Knowledge đã cập nhật, work đã được archive. Nếu cần sửa thêm, vui lòng tạo issue/feature mới."
          gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"
          gh issue close "$ISSUE_NUMBER"

          if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
            exit 0
          fi
          ISSUE_BODY="$(gh issue view "$ISSUE_NUMBER" --json body -q .body)"
          CHANNEL_ID="$(printf '%s' "$ISSUE_BODY" | grep -oP '(?<=channel_id=)\S+' || true)"
          THREAD_TS="$(printf '%s' "$ISSUE_BODY" | grep -oP '(?<=thread_ts=)\S+' || true)"
          if [ -z "$CHANNEL_ID" ]; then
            exit 0
          fi
          curl -fsS -X POST "$SLACK_WORKER_URL/relay" \
            -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$CHANNEL_ID" --arg t "$THREAD_TS" --arg x "$MESSAGE" \
                  '{channel_id:$c, thread_ts:$t, text:$x}')" || true

      - name: Report technical failure
        if: steps.slug.outputs.already_done == 'false' && env.RESULT == 'technical_error'
        run: |
          relay_to_slack() {
            local issue_number="$1" text="$2"
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 0
            fi
            local issue_body channel_id thread_ts
            issue_body="$(gh issue view "$issue_number" --json body -q .body)"
            channel_id="$(printf '%s' "$issue_body" | grep -oP '(?<=channel_id=)\S+' || true)"
            thread_ts="$(printf '%s' "$issue_body" | grep -oP '(?<=thread_ts=)\S+' || true)"
            if [ -z "$channel_id" ]; then
              return 0
            fi
            curl -fsS -X POST "$SLACK_WORKER_URL/relay" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg c "$channel_id" --arg t "$thread_ts" --arg x "$text" \
                    '{channel_id:$c, thread_ts:$t, text:$x}')" || true
          }

          # Put the issue back into "awaiting followup" state so the user can comment again to
          # retry (AC12) — defensive-create in case this repo somehow never created the label.
          gh label list --json name -q '.[].name' | grep -qx online-pipeline-merged-awaiting-followup \
            || gh label create online-pipeline-merged-awaiting-followup --description "online-pipeline" --color "E99695"
          gh issue edit "$ISSUE_NUMBER" --add-label online-pipeline-merged-awaiting-followup || true

          MESSAGE="Finalize job failed after 3 attempts (2 retries). Check the Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"
          relay_to_slack "$ISSUE_NUMBER" "$MESSAGE"
          exit 1
