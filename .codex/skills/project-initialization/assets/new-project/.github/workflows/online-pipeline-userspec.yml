name: Online Pipeline - User Spec

# Covers user-spec-planning Steps 1-5 (interview, completeness check, draft, validate) plus the
# "/approve" PR-merge handoff that replaces Step 6 for this pipeline. See
# skills/online-pipeline/SKILL.md for the naming contract and per-stage agent instructions.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  route:
    if: github.event_name == 'issues' || github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.route.outputs.action }}
      slug: ${{ steps.route.outputs.slug }}
      branch: ${{ steps.route.outputs.branch }}
      pr_number: ${{ steps.route.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine stage
        id: route
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          # JSON array, checked with jq's case-sensitive exact-element match, not a joined/split
          # string: label names may themselves contain a comma (ruling out join(',')+split(',')),
          # and GitHub Actions' own contains()/== on strings is case-insensitive (which would let a
          # differently-cased label such as "Local-Placeholder" also match).
          ISSUE_LABELS_JSON: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          set -euo pipefail

          slugify() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40
          }

          if [ "$IS_PR_COMMENT" = "true" ]; then
            if [ "$COMMENT_BODY" != "/approve" ]; then
              echo "action=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PR_NUMBER="$ISSUE_NUMBER"
            LABELS="$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name')"
            STATE="$(gh pr view "$PR_NUMBER" --json state -q '.state')"
            if [ "$STATE" != "OPEN" ] || ! printf '%s\n' "$LABELS" | grep -qx "userspec-spec"; then
              echo "action=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            BRANCH="$(gh pr view "$PR_NUMBER" --json headRefName -q '.headRefName')"
            SLUG="${BRANCH#userspec/}"
            echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "action=approve" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s' "$ISSUE_LABELS_JSON" | jq -e 'index("local-placeholder") != null' >/dev/null; then
            # Feature is still being worked on locally (Start path created this issue with the
            # local-placeholder label and hasn't switched online yet) — never auto-post here while
            # that's true, for either event type, to avoid racing the local session.
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s' "$ISSUE_LABELS_JSON" | jq -e 'index("knowledge-init") != null' >/dev/null; then
            # This issue belongs to online-pipeline-knowledge-init.yml's stage, not this pipeline —
            # never dispatch user-spec-planning onto it.
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SLUG="$(slugify "$ISSUE_TITLE")-${ISSUE_NUMBER}"
          BRANCH="userspec/$SLUG"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "issues" ]; then
            echo "action=start" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # No spec branch yet for this issue number: either truly new (issues:opened was
            # missed), this issue already passed the spec phase (branch was deleted on merge), or
            # the feature was switched to online entirely from local during implement, skipping the
            # spec-branch phase for this issue entirely — feature/{slug} existing remotely is a
            # third, equally valid "already done" signal alongside approved-on-main.
            DONE=false
            if [ -f "work/$SLUG/user-spec.md" ] && grep -q '^status: approved' "work/$SLUG/user-spec.md"; then
              DONE=true
            fi
            if git ls-remote --exit-code --heads origin "feature/$SLUG" >/dev/null 2>&1; then
              DONE=true
            fi
            if [ "$DONE" = true ]; then
              echo "action=skip" >> "$GITHUB_OUTPUT"
            else
              echo "action=start" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          if [ -f "work/$SLUG/user-spec.md" ] && grep -q '^status: approved' "work/$SLUG/user-spec.md"; then
            echo "action=skip" >> "$GITHUB_OUTPUT"
          else
            echo "action=continue" >> "$GITHUB_OUTPUT"
          fi

  approve:
    needs: route
    if: needs.route.outputs.action == 'approve'
    runs-on: ubuntu-latest
    # Keyed by slug (not issue number): a PR comment's github.event.issue.number is the PR's own
    # number, different from the originating issue's — keying by issue number would let an
    # approve run and a same-feature "continue" run (triggered by a comment on the issue itself)
    # race on the same userspec/{slug} branch. route derives slug the same way for both event
    # shapes, so this group matches the userspec job's group below for the same feature.
    concurrency:
      group: online-pipeline-userspec-${{ needs.route.outputs.slug }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.route.outputs.branch }}

      - name: Mark the spec approved
        env:
          SLUG: ${{ needs.route.outputs.slug }}
          # Routed through env, not interpolated into the script body: this PR's headRefName is
          # attacker-reachable (anyone who can open a PR controls it) and, unlike SLUG, is not
          # restricted to a safe character set — a crafted branch name interpolated directly here
          # would be arbitrary shell execution in the one job that later holds GH_PAT.
          BRANCH: ${{ needs.route.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.email "online-pipeline[bot]@users.noreply.github.com"
          git config user.name "online-pipeline[bot]"
          sed -i 's/^status: draft$/status: approved/' "work/$SLUG/user-spec.md"
          sed -i 's/status: "in_progress"/status: "completed"/' "work/$SLUG/logs/userspec/interview.yml"
          git add "work/$SLUG/user-spec.md" "work/$SLUG/logs/userspec/interview.yml"
          # A prior /approve run on this same PR may have already committed+pushed this exact
          # change and only failed on the next step (e.g. "Merge the spec PR" hitting GitHub's
          # transient "Base branch was modified" race) — re-running then finds nothing left to
          # stage, since the checkout already has the approved commit. Skip straight to the merge
          # retry instead of letting an empty `git commit` fail the whole job again.
          if ! git diff --cached --quiet; then
            git commit -m "chore(userspec): approve user-spec for $SLUG"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Merge the spec PR
        env:
          # Must be a PAT, not GITHUB_TOKEN: GitHub does not let the default token's actions
          # trigger other workflow runs, and this merge must trigger online-pipeline-implement.yml.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh pr merge "${{ needs.route.outputs.pr_number }}" --merge --delete-branch

  userspec:
    needs: route
    if: needs.route.outputs.action == 'start' || needs.route.outputs.action == 'continue'
    runs-on: ubuntu-latest
    concurrency:
      group: online-pipeline-userspec-${{ needs.route.outputs.slug }}
      cancel-in-progress: false
    env:
      SLUG: ${{ needs.route.outputs.slug }}
      BRANCH: ${{ needs.route.outputs.branch }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Both empty on a repo that never ran the Slack onboarding step — relay_to_slack (see
      # skills/online-pipeline/SKILL.md, Slack Bridge) no-ops in that case, same as today.
      SLACK_RELAY_TOKEN: ${{ secrets.SLACK_RELAY_TOKEN }}
      SLACK_WORKER_URL: ${{ secrets.SLACK_WORKER_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout or create the spec branch
        run: |
          set -euo pipefail
          git config user.email "online-pipeline[bot]@users.noreply.github.com"
          git config user.name "online-pipeline[bot]"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          mkdir -p "work/$SLUG/logs/working"
          printf 'status: in_progress\n' > "work/$SLUG/logs/working/online-pipeline-status.yml"

      - name: Select Claude auth method
        run: |
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "Using Claude subscription OAuth token"
          elif [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "Using Anthropic API key"
          else
            echo "::error::Set either CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as a repo secret"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run userspec-turn
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ACTION: ${{ needs.route.outputs.action }}
        run: |
          set -euo pipefail

          relay_to_slack() {
            local issue_number="$1" text="$2"
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 0
            fi
            local issue_body channel_id thread_ts
            issue_body="$(gh issue view "$issue_number" --json body -q .body)"
            channel_id="$(printf '%s' "$issue_body" | grep -oP '(?<=channel_id=)\S+' || true)"
            thread_ts="$(printf '%s' "$issue_body" | grep -oP '(?<=thread_ts=)\S+' || true)"
            if [ -z "$channel_id" ]; then
              return 0
            fi
            curl -fsS -X POST "$SLACK_WORKER_URL/relay" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg c "$channel_id" --arg t "$thread_ts" --arg x "$text" \
                    '{channel_id:$c, thread_ts:$t, text:$x}')" || true
          }

          # Rate-limit auto-switch (control-plane token pool) — see online-pipeline-implement.yml's
          # identical helper for the full rationale (Risk 1 fixed-string matching, fail-open on any
          # non-"no_alias_available" Worker outcome).
          try_rate_limit_switch() {
            if ! grep -qF "You've hit your session limit" "$CLAUDE_OUTPUT_FILE" \
               && ! grep -qF "You've hit your weekly limit" "$CLAUDE_OUTPUT_FILE"; then
              return 1
            fi
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 1
            fi
            local reset_text resp ok err
            reset_text="$(grep -oP "resets .*\)" "$CLAUDE_OUTPUT_FILE" | tail -1 || true)"
            resp="$(curl -fsS -X POST "$SLACK_WORKER_URL/switch-token/auto" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg o "${GITHUB_REPOSITORY%%/*}" --arg r "${GITHUB_REPOSITORY##*/}" --arg t "$reset_text" \
                    '{owner:$o, repo:$r, rateLimitResetText:$t}')" 2>/dev/null || true)"
            ok="$(printf '%s' "$resp" | jq -r '.ok // false' 2>/dev/null || echo false)"
            if [ "$ok" = "true" ]; then
              CURRENT_TOKEN="$(printf '%s' "$resp" | jq -r '.token')"
              echo "Rate limit detected — switched to pool alias $(printf '%s' "$resp" | jq -r '.alias')."
              return 0
            fi
            err="$(printf '%s' "$resp" | jq -r '.error // ""' 2>/dev/null || echo "")"
            if [ "$err" = "no_alias_available" ]; then
              SWITCH_EXHAUSTED=true
            fi
            return 1
          }

          STATUS_FILE="work/$SLUG/logs/working/online-pipeline-status.yml"
          LAST_GOOD="$(git rev-parse HEAD)"
          ATTEMPTS=3
          RESULT="technical_error"
          CURRENT_TOKEN="${CLAUDE_CODE_OAUTH_TOKEN:-}"
          # Comment count, not status-file state — see SKILL.md, Stage userspec-turn step 4: the
          # agent never calls relay_to_slack itself anymore, since in production it sometimes
          # posted the gh issue comment but skipped its own relay reproduction. This mirrors
          # every new bot comment deterministically instead. Also doubles as this loop's own
          # per-attempt success signal (see below): unlike implement/knowledge-init, a userspec
          # turn that merely continues the interview never changes the status marker away from
          # in_progress, so "did this attempt post anything" is what distinguishes a normal
          # continuing turn from a technical failure that produced nothing.
          BEFORE_COMMENT_COUNT="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments | length')"
          RATE_LIMIT_RESUME_COUNT=0

          for ATTEMPT in 1 2 3; do
            echo "userspec-turn attempt $ATTEMPT/$ATTEMPTS"

            printf 'status: in_progress\n' > "$STATUS_FILE"

            PROMPT_FILE="$(mktemp)"
            {
              echo "Use the online-pipeline skill (.claude/skills/online-pipeline/SKILL.md), stage \"userspec-turn\"."
              echo "Issue: #$ISSUE_NUMBER"
              echo "Feature slug: $SLUG"
              echo "Feature folder: work/$SLUG"
              echo "Branch: $BRANCH"
              echo ""
              if [ "$ACTION" = "start" ] && [ "$ATTEMPT" -eq 1 ]; then
                echo "This is the first run for this issue. Issue body (initial task description):"
                echo "$ISSUE_BODY"
              else
                echo "Latest issue comment (treat as the newest user answer):"
                echo "$COMMENT_BODY"
              fi
              echo ""
              echo "ONLINE_PIPELINE_AUTOMATED"
            } > "$PROMPT_FILE"
            CLAUDE_FLAGS=(-p)
            CLAUDE_PROMPT_TEXT="$(cat "$PROMPT_FILE")"

            # Inner loop: see online-pipeline-implement.yml's identical inner loop for the full
            # rationale — a rate-limit mid-attempt swaps CURRENT_TOKEN and continues the exact same
            # Claude Code session with -c/--continue ("rate-limit resume", see SKILL.md) instead of
            # falling through to the outer loop's reset-and-retry-from-scratch below. It never
            # advances ATTEMPT; only a genuine (non-rate-limit) technical failure breaks out.
            while true; do
              CLAUDE_OUTPUT_FILE="$(mktemp)"
              set +e
              # SLACK_RELAY_TOKEN/SLACK_WORKER_URL deliberately blanked for this child process only
              # (the surrounding shell keeps the real values for the deterministic relay below) — the
              # agent must never self-relay (see SKILL.md), and a prose instruction alone proved
              # insufficient to guarantee that in production: this makes any self-relay attempt a
              # harmless no-op/401 instead of a real duplicate Slack post.
              CLAUDE_CODE_OAUTH_TOKEN="$CURRENT_TOKEN" SLACK_RELAY_TOKEN="" SLACK_WORKER_URL="" \
                claude "${CLAUDE_FLAGS[@]}" "$CLAUDE_PROMPT_TEXT" --dangerously-skip-permissions 2>&1 | tee "$CLAUDE_OUTPUT_FILE"
              set -e

              AFTER_COMMENT_COUNT="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments | length')"
              NEW_COMMENTS=$((AFTER_COMMENT_COUNT - BEFORE_COMMENT_COUNT))
              if [ "$NEW_COMMENTS" -gt 0 ]; then
                RELAY_COUNT=0
                while IFS= read -r COMMENT_JSON; do
                  COMMENT_TEXT="$(printf '%s' "$COMMENT_JSON" | jq -r '.')"
                  relay_to_slack "$ISSUE_NUMBER" "$COMMENT_TEXT"
                  RELAY_COUNT=$((RELAY_COUNT + 1))
                done < <(gh issue view "$ISSUE_NUMBER" --json comments --jq ".comments[$BEFORE_COMMENT_COUNT:]" \
                          | jq -c '.[] | select(.author.login == "github-actions") | .body')
                echo "Relayed $RELAY_COUNT new bot comment(s) to Slack ($NEW_COMMENTS new comment(s) total)."
              fi
              BEFORE_COMMENT_COUNT="$AFTER_COMMENT_COUNT"

              STATUS="$(grep -oP '(?<=^status: ).*' "$STATUS_FILE" 2>/dev/null || echo in_progress)"

              if [ "$STATUS" = "ready_for_review" ] || [ "$NEW_COMMENTS" -gt 0 ]; then
                RESULT="success"
                break 2
              fi

              echo "Technical failure (status: $STATUS, no new comment posted)."
              if try_rate_limit_switch; then
                RATE_LIMIT_RESUME_COUNT=$((RATE_LIMIT_RESUME_COUNT + 1))
                echo "Rate-limit resume #$RATE_LIMIT_RESUME_COUNT — continuing previous session with new token"
                CLAUDE_FLAGS=(-p -c)
                CLAUDE_PROMPT_TEXT="Your Claude Code token was refreshed after a rate limit. Continue exactly where you left off on this same task — do not restart from the beginning."
                continue
              elif [ "${SWITCH_EXHAUSTED:-false}" = "true" ]; then
                RESULT="rate_limit_pool_exhausted"
                break 2
              fi
              break
            done

            if [ "$ATTEMPT" -lt "$ATTEMPTS" ]; then
              git push --force origin "$LAST_GOOD:refs/heads/$BRANCH"
              git reset --hard "$LAST_GOOD"
              git clean -fd
            fi
          done

          echo "RESULT=$RESULT" >> "$GITHUB_ENV"

      - name: Report technical failure
        if: env.RESULT == 'technical_error'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          relay_to_slack() {
            local issue_number="$1" text="$2"
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 0
            fi
            local issue_body channel_id thread_ts
            issue_body="$(gh issue view "$issue_number" --json body -q .body)"
            channel_id="$(printf '%s' "$issue_body" | grep -oP '(?<=channel_id=)\S+' || true)"
            thread_ts="$(printf '%s' "$issue_body" | grep -oP '(?<=thread_ts=)\S+' || true)"
            if [ -z "$channel_id" ]; then
              return 0
            fi
            curl -fsS -X POST "$SLACK_WORKER_URL/relay" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg c "$channel_id" --arg t "$thread_ts" --arg x "$text" \
                    '{channel_id:$c, thread_ts:$t, text:$x}')" || true
          }
          MESSAGE="userspec-turn job failed after 3 attempts (2 retries). Check the Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"
          relay_to_slack "$ISSUE_NUMBER" "$MESSAGE"
          exit 1

      - name: Report rate-limit pool exhausted
        if: env.RESULT == 'rate_limit_pool_exhausted'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          relay_to_slack() {
            local issue_number="$1" text="$2"
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 0
            fi
            local issue_body channel_id thread_ts
            issue_body="$(gh issue view "$issue_number" --json body -q .body)"
            channel_id="$(printf '%s' "$issue_body" | grep -oP '(?<=channel_id=)\S+' || true)"
            thread_ts="$(printf '%s' "$issue_body" | grep -oP '(?<=thread_ts=)\S+' || true)"
            if [ -z "$channel_id" ]; then
              return 0
            fi
            curl -fsS -X POST "$SLACK_WORKER_URL/relay" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg c "$channel_id" --arg t "$thread_ts" --arg x "$text" \
                    '{channel_id:$c, thread_ts:$t, text:$x}')" || true
          }
          MESSAGE="Mọi token trong pool đều đang bị rate-limit, dừng tự động — thêm token mới qua /add-token hoặc đợi reset. Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"
          relay_to_slack "$ISSUE_NUMBER" "$MESSAGE"
          exit 1

      - name: Open or update the spec PR
        if: env.RESULT == 'success'
        run: |
          set -euo pipefail

          relay_to_slack() {
            local issue_number="$1" text="$2"
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 0
            fi
            local issue_body channel_id thread_ts
            issue_body="$(gh issue view "$issue_number" --json body -q .body)"
            channel_id="$(printf '%s' "$issue_body" | grep -oP '(?<=channel_id=)\S+' || true)"
            thread_ts="$(printf '%s' "$issue_body" | grep -oP '(?<=thread_ts=)\S+' || true)"
            if [ -z "$channel_id" ]; then
              return 0
            fi
            curl -fsS -X POST "$SLACK_WORKER_URL/relay" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg c "$channel_id" --arg t "$thread_ts" --arg x "$text" \
                    '{channel_id:$c, thread_ts:$t, text:$x}')" || true
          }

          STATUS="$(grep -oP '(?<=^status: ).*' "work/$SLUG/logs/working/online-pipeline-status.yml" 2>/dev/null || echo in_progress)"
          git push origin "HEAD:$BRANCH" || true
          if [ "$STATUS" != "ready_for_review" ]; then
            exit 0
          fi
          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' || true)"
          if [ -z "$EXISTING" ]; then
            gh label list --json name -q '.[].name' | grep -qx userspec-spec || gh label create userspec-spec --description "online-pipeline" --color "0E8A16"
            gh pr create --base main --head "$BRANCH" \
              --title "user-spec: $SLUG" \
              --body "Auto-generated by online-pipeline. Review work/$SLUG/user-spec.md, then comment /approve on this PR to continue." \
              --label userspec-spec
          fi
          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          ISSUE_NUMBER="${SLUG##*-}"
          MESSAGE="Spec ready for review: #$PR_NUMBER. Comment \`/approve\` on that PR to continue."
          gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"
          relay_to_slack "$ISSUE_NUMBER" "$MESSAGE"
