      marker đã tạo xong thành công (giữ label ổn định tới khi chắc chắn, giống cách nhánh "chốt"
      AC9 đang làm).
    user_answer: "ok"

  - asked_at: "2026-10-09 03:00:00"
    topic_keys: ["technical_decisions", "edge_cases", "acceptance_criteria", "integration_points"]
