         là branch nào".
      2. Dưới workflow_dispatch, job finalize không còn github.event.pull_request.head.ref để đọc
         slug như hiện tại — phải nhận slug qua input khi job xử lý comment dispatch nó.
      3. gh workflow run cần quyền actions: write — job dispatch hiện chưa có.
      4. AC6 (bản nháp) chỉ đếm PR có tiền tố r*-, bỏ sót round 1 (feature/{slug} không tiền tố) →
         lần sửa đầu tiên tính ra r1, mâu thuẫn với phần Verification đang viết r2.
      5. AC7 (bản nháp) chỉ định nghĩa cancel-in-progress cho lúc ĐÃ có round-branch; chưa định
         nghĩa cho lúc agent đang phân loại comment (trước khi round mới được tạo).
    user_answer: |
      Q1: Đề xuất ban đầu (gh pr list --state open động) → user đề xuất thay bằng lưu 1 marker
      "active_branch" trong issue body (giống Slack marker), update mỗi khi tạo round mới. Agent
      xác nhận: marker vắng mặt = ngầm định round 1 (feature/{slug}), không cần sửa gì ở stage
      implement gốc; chỉ stage post-merge (tạo round N≥2) mới cần viết marker này. Route
      job/implement job/SKILL.md đọc marker này (mặc định feature/{slug} nếu vắng mặt) thay cho
      literal feature/$SLUG. Đồng ý.
      Q2: Agent giải thích lý do cần đọc slug (để biết archive đúng work/{slug}, đóng đúng issue).
      User: ok, xác nhận cần truyền slug/issue_number qua workflow_dispatch input.
      Q3: ok, thêm actions: write vào job dispatch, dùng GITHUB_TOKEN mặc định.
      Q4: User ban đầu đề xuất đổi CẢ round 1 thành feature/r1-{slug} (đồng nhất mọi round). Agent
      chỉ ra hệ quả: điều này đổi luôn Naming Contract của stage `implement` gốc đã chạy production
      (vượt phạm vi feature này), và đề xuất phương án (A) giữ round 1 là feature/{slug} không đổi,
      chỉ sửa công thức đếm N để tính cả round 1 (khớp feature/{slug} HOẶC feature/r*-{slug}, +1).
      User chọn phương án (A): "Ok a đi."
      Q5: ok, áp dụng cancel-in-progress cho cả lúc đang phân loại comment (trước khi có
      round-branch), nhất quán với nguyên tắc ưu tiên comment mới nhất.

  - asked_at: "2026-10-09 02:30:00"
