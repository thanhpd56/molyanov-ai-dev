general_understanding:
  feature_name:
    score: 90
    value: "slack-pipeline-interaction — tương tác với online-pipeline qua Slack thay vì chỉ qua GitHub issue"
    gaps: []
    required: true

  feature_description:
    score: 85
    value: |
      PHẦN A — Tương tác Slack cho repo đã bật online-pipeline: mở rộng
      skills/online-pipeline/SKILL.md, 1 channel cố định/project (tạo tay 1 lần), 1 thread/feature.
      Slash command bắt đầu feature mới (tạo GitHub issue, nhúng channel_id+thread_ts vào body).
      Toàn bộ tương tác (interview Q&A, awaiting_decision, approve spec PR, approve/merge code PR)
      làm được từ Slack — post song song GitHub (gh issue comment, như cũ) VÀ Slack
      (chat.postMessage vào đúng thread). Approve dùng literal "!approve" gõ trong thread (không
      phải slash-command thật), Worker tự route theo status marker: spec-PR thì giả lập comment
      "/approve" lên PR (tái dùng route job cũ nguyên vẹn); code-PR thì gọi merge REST API trực
      tiếp (năng lực mới, không cần workflow/trigger mới vì pull_request:closed không phân biệt
      actor). Cầu nối là 1 Cloudflare Worker (free tier) nhận Slack event/slash-command, verify
      signing secret, gọi GitHub API. Mapping: thread<->feature nhúng trong body issue (Actions
      đọc trực tiếp); chiều Slack-event->issue lưu Cloudflare KV (Worker tự ghi lúc tạo issue).

      PHẦN B — Khởi tạo project GitHub hoàn toàn mới từ Slack (/new-project): 1 repo điều phối
      (control-plane) MỚI, riêng biệt, chứa 1 GitHub Actions workflow nhận repository_dispatch từ
      Worker (dùng chung credential với Phần A). Workflow đó: gh repo create (account hiện tại,
      private), chạy claude -p thật với skill project-initialization (cần sửa skill này thêm 1 chế
      độ tự động — bỏ các bước "ask" vì bootstrap luôn chạy trên thư mục trống/origin chưa tồn tại,
      tự push main không hỏi), rồi tự vendor + set secrets cho CẢ online-pipeline VÀ Slack
      integration của Phần A trên repo mới (copy GH_PAT, Claude auth credential, VÀ SLACK_BOT_TOKEN
      — sửa sau completeness-check lần 4, cần cho chính repo mới tự gọi Slack API — dùng chung từ
      control-plane) — không cần chạy script tay ở local. Claude GitHub App cài 1 LẦN ở mức "All
      repositories" trên account, nên repo mới tự động được cover, không cần cài lại tay. User tự
      tạo channel Slack cho project mới TRƯỚC, gõ /new-project NGAY TRONG channel đó.

      Quyết định: giữ CHUNG 1 user-spec cho cả A và B (user đã xác nhận, dù 2 mảng tách được).
    gaps: []
    required: true

  work_type:
    score: 100
    value: "feature"
    gaps: []
    required: true

  user_problem:
    score: 80
    value: |
      Hiện tại online-pipeline chỉ tương tác qua GitHub issue/PR comment — người dùng phải mở
      GitHub (web/app) để trả lời câu hỏi interview, xem awaiting_decision, hay approve. Người
      dùng muốn làm việc này ngay trong Slack (nơi họ đã quen chat), chỉ ra GitHub khi cần xem
      diff code thật.
    gaps: []
    required: true

  target_users:
    score: 85
    value: |
      Người dùng solo (chủ repo/account GitHub + chủ Slack workspace) — KHÔNG phân quyền trong
      Slack workspace, đã XÁC NHẬN LẠI sau khi phạm vi mở rộng sang merge code trực tiếp qua
      !approve và tạo repo mới qua /new-project (2 năng lực mạnh, tiêu tốn credential quyền rộng
      toàn account): user vẫn chủ động chấp nhận không giới hạn, vì thực tế workspace chỉ có
      mình user. Rủi ro chỉ phát sinh nếu sau này có thêm người khác vào workspace — ghi nhận ở
      Risks, không xây cơ chế giới hạn cho v1.
    gaps: []
    required: false

  success_criteria:
    score: 85
    value: |
      - Gõ slash command (ví dụ /new-feature) trong channel project trên Slack -> GitHub issue
        mới xuất hiện (body nhúng channel_id+thread_ts), thread mới xuất hiện trong channel đó,
        userspec-turn chạy và post câu hỏi đầu tiên vào ĐÚNG thread (và đồng thời gh issue comment
        như cũ).
      - Trả lời câu hỏi bằng tin nhắn thường trong thread -> Worker relay thành gh issue comment,
        interview tiến triển đúng, câu hỏi tiếp theo xuất hiện lại trong Slack VÀ GitHub.
      - Lúc awaiting_decision (implement) -> câu hỏi/finding xuất hiện trong thread.
      - Gõ "!approve" trong thread lúc spec PR đang chờ review -> spec PR được approve+merge thật
        (giống hệt hành vi /approve comment hiện có), implement bắt đầu, xác nhận xuất hiện trong
        thread.
      - Gõ "!approve" trong thread lúc code PR đang chờ review -> code PR được merge thật qua
        Worker gọi REST API trực tiếp (năng lực mới), finalize chạy, xác nhận xuất hiện trong
        thread.
      - Finalize xong -> message "Feature xong" xuất hiện trong thread (năng lực mới).
      - PHẦN B: tự tạo channel Slack tay cho project mới, gõ /new-project <tên-repo> trong đó ->
        repo GitHub mới xuất hiện (private, account hiện tại), đã chạy project-initialization đầy
        đủ (main+dev, hooks), đã tự vendor+set-secret online-pipeline VÀ Slack, sẵn sàng
        /new-feature ngay trong channel đó — không cần chạy script/terminal nào ở local.
