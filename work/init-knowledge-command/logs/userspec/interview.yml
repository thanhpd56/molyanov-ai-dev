  - Automatic trigger (right after a fresh /new-project Slack bootstrap): new-repo-only,
    inherent to firing once per bootstrap event. Unchanged since the first interview batch.
  - Manual Slack slash command: lifts the "must be freshly bootstrapped" TIMING restriction
    only. It keeps create-project-knowledge.md's own stated precondition verbatim — "documentation
    is missing, still a template, or only partially filled" — so it also works on an old,
    pre-existing repo that never got Project Knowledge set up, but is NOT a generic "trigger
    documentation-writing on demand" command and does not drive the structurally different
    single-pass "full update/audit" mode.
  - Already-complete repo: immediate "already initialized" comment + issue close (informational
    no-op, not a retryable failure, no new validation framework — reuses the existing
    missing/template/partial check).
  - Already in_progress repo (open "knowledge-init" issue exists): report that one already
    exists instead of creating a second issue/thread.

  This resolves (in order of discovery): the finalize-vs-multi-turn persistence contradiction
  (resolved: every turn commits interview.yml straight to main, no branch, ever), the
  unenforced new-repo-only boundary on the manual command (resolved: scope lifted deliberately,
  not enforced as a block), the "return to main skill" navigation step (resolved: automated
  stage skips it and just stops), and finally the mechanics gap the scope lift itself exposed
  (resolved via the already-complete / already-in_progress behaviors above).
