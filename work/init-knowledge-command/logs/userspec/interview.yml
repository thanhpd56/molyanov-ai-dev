  constraints:
    score: 95
    value: |
      Automatic trigger (issue auto-created right after a fresh /new-project bootstrap) is
      inherently new-repo-only — it fires once per bootstrap event. The manual Slack slash
      command is usable on any repo already linked in Slack, new or old, as long as its Project
