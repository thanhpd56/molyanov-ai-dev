      between separate Actions runs; the final turn additionally commits the written Project
      Knowledge files and closes the issue — no PR at any point.
      Label "knowledge-init" distinguishes the issue from a /new-feature issue;
      online-pipeline-userspec.yml's route job must ignore issues carrying this label (same as
      "local-placeholder"). The automated stage must skip create-project-knowledge.md's "Return
      to Documentation Review in the main skill" instruction — it just stops after commit +
      issue close. Idempotency/completion marker: the existing
      interview_metadata.status: completed field. Failure handling follows the existing
