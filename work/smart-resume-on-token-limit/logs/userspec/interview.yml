conversation_history:
  - asked_at: "2026-10-06 00:00:00"
    topic_keys: ["feature_description", "user_problem", "constraints", "technical_decisions"]
    agent_questions: |
      Bối cảnh đã nắm: cả 3 workflow (userspec-turn, implement, knowledge-init) có loop
      ATTEMPTS=3; mỗi attempt fail đều git reset --hard về LAST_GOOD rồi gửi lại prompt gốc từ
      đầu ở attempt kế, áp dụng cho mọi loại lỗi kể cả rate-limit. Claude Code CLI hỗ trợ
      -r/--resume <session-id> và -c/--continue ở mode -p, cộng --session-id <uuid>.

      1. "Limit time của token" — có phải chính là rate-limit Claude (session 5h / weekly 7
         ngày) mà auto-switch hiện tại đã detect qua 2 chuỗi "You've hit your session limit" /
         "...weekly limit"? Hay còn tính cả GitHub Actions job timeout (job/runner bị huỷ hoàn
         toàn — không có gì để --resume vì runner mới trắng tinh)?
      2. Resume áp dụng cho cả 3 stage, hay chỉ implement (nơi duy nhất có "code dở" đáng giữ)?
      3. "Tiếp tục từ đó" là (a) dùng --resume/-c của Claude Code để agent nhớ lại toàn bộ ngữ
         cảnh, không cần gửi lại prompt gốc; hay (b) chỉ bỏ git reset, gửi prompt mới bảo agent
         tự xem git diff/log rồi tiếp tục?
      4. ATTEMPTS=3 hiện tại — resume do rate-limit vẫn tính vào 3 lần, hay tách riêng counter?
    user_answer: |
      1. loại 1 (chỉ rate-limit Claude, không tính GitHub Actions job timeout)
      2. cả 3 stage
      3. (a) dùng --resume/-c của Claude Code
      4. tách riêng counter khỏi ATTEMPTS=3

  - asked_at: "2026-10-06 00:05:00"
    topic_keys: ["constraints", "technical_decisions", "error_scenarios"]
    agent_questions: |
