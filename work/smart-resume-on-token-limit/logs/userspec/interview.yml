      2. Nếu lệnh resume (claude -p -c/-r ...) bản thân lỗi kỹ thuật (không phải rate-limit nữa) —
         fallback về đúng hành vi cũ (git reset LAST_GOOD, tính vào 3 ATTEMPTS)?
      3. Dùng -c/--continue (tiếp tục hội thoại gần nhất trong cùng cwd) thay vì tự generate
         --session-id tường minh — đồng ý chứ?
      4. Sau khi resume thành công, logic detect STATUS/relay Slack... giữ nguyên không đổi, chỉ
         thêm 1 dòng log phân biệt "Resumed after rate-limit (resume #N)"?
    user_answer: |
      1. Không cap cứng.
      2. đúng
      3. ok
      4. ok

  - asked_at: "2026-10-06 00:10:00"
    topic_keys: ["success_criteria", "testing_strategy", "verification_strategy", "edge_cases"]
    agent_questions: |
      1. Thuật ngữ "rate-limit resume" (phân biệt với "implement-resume" có sẵn) — đồng ý?
