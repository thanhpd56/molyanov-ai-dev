general_understanding:
  feature_name:
    score: 90
    value: "New skill `online-pipeline` added to molyanov-ai-dev (skills/online-pipeline/), parallel to project-initialization and user-spec-planning"
    gaps: []
    required: true

  feature_description:
    score: 80
    value: |
      Add a new skill to molyanov-ai-dev that lets a single-repo project run the planning lifecycle
      (request -> interview -> approve -> implement -> PR) entirely through GitHub, without a local
      CLI session. A GitHub issue is the request; issue comments carry the interview Q&A and the
      `/approve` command; after approval a GitHub Actions job runs Claude Code non-interactively
      against the approved user-spec, implements the change, and opens a PR in the same repo.
    gaps: []
    required: true

  work_type:
    score: 100
    value: "feature (new skill + bundled assets in molyanov-ai-dev)"
    gaps: []
    required: true

  user_problem:
    score: 85
