  acceptance_criteria:
    score: 90
    value: |
      1. Opening a new issue on an online-pipeline-enabled repo gets the first interview question as
         a comment.
      2. Answering through enough rounds gets a PR containing user-spec.md for preview.
      3. Commenting `/approve` on that PR closes it and starts the implement job.
      4. A successful implement job opens a code PR in the same repo.
      5. A failed implement job auto-retries up to 2 times; if still failing, it comments the error
         on the issue and stops (no further auto-retry).
      6. Merging the code PR automatically runs finalize: Project Knowledge is updated and
         work/{feature} is archived to work/completed/{feature}, with no incompleteness check
         gating it (decision A - merge already implies confirmation).
      7. Two issues (two features) opened close together on the same repo run independently without
         blocking each other; if their finalize jobs would run at the same time, they serialize
         instead of racing on Project Knowledge files.
      8. The setup works both on an existing project (standalone enablement) and a newly created one
         (project-initialization integration).
      9. `/approve` merges the spec PR into main (not just closes it), so user-spec.md/decisions.md
         land at a fixed, known path on main before the implement job runs.
      10. During any validation round, a reviewer's `user_decision_required` finding is posted as an
          issue comment and the job stops; the user's reply comment resumes that validation round -
          the same mechanism as an interview turn, not a new one.
      11. The implement job's own review flow (code-reviewer/security-auditor) raising a
          `user_decision_required` finding uses the same pause/comment/resume mechanism as item 10,
          committing finished work first so resume continues rather than restarts; this does not
          count against the 2-retry failure limit.
      12. An implement-job failure-retry resets the branch to a clean base (force-push) before each
          attempt rather than resuming the failed attempt's partial state - applied uniformly to
          every failure cause, no branching by failure type.
      13. The spec PR (branch `userspec/{slug}`, label `userspec-spec`) and the code PR (branch
          `feature/{slug}`, label `userspec-implement`) are distinguishable, so finalize's
          `pull_request: closed, merged=true` trigger only fires on the code PR's label/branch and
          never on the spec PR's merge.
      14. A finalize-job failure follows the same policy as implement: auto-retry up to 2 times, then
          comment the failure on the issue (no manual re-trigger command exists for finalize).
      15. No job triggered by `issue_comment: created` ever re-triggers on the bot's own comment
