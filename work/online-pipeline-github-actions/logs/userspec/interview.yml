    required: true

  error_scenarios:
    score: 85
    value: |
      Implement job failure (Claude error, push conflict, quota): auto-retry up to 2 times, resetting
      the branch to a clean base before each retry (force-push, discard the failed attempt's partial
      state) rather than trying to resume it; after 2 retries, stop and comment the failure on the
      issue for manual follow-up. Interview-turn and draft/validation-round failures do not
      auto-retry: the workflow fails and the user re-triggers by commenting again.

      Separately, a `user_decision_required` finding (not a failure) during validation OR during the
      implement job's own review flow (code-reviewer/security-auditor) is handled differently from a
      failure: the job commits whatever work is already done to the branch, posts the question as an
      issue comment, and stops - not counted against the 2 retries, since retrying cannot resolve a
      decision question. The user's reply comment resumes the job, which checks out that same branch
      (partial work already committed) and continues from there instead of redoing finished work.

      Reset-and-restart-clean applies uniformly to every implement-job failure cause (Claude error,
      push conflict, quota) - no branching by failure type, accepting the extra token cost on a
      push-conflict retry in exchange for v1 simplicity.

      Finalize job failure uses the same policy as implement: auto-retry up to 2 times, then comment
      the failure on the issue (finalize has no manual re-trigger command, since its only trigger is
      an automatic PR-merge event; after exhausting retries the user must investigate and finalize
