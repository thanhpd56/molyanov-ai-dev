      [Agent explained: force-reset means any correct work done before a crash is discarded, costing
      full re-implementation tokens even if the failure happened at 90% done - chosen as the default
      because nothing guarantees the on-disk/branch state after a crash is safe to build on. Of the
      three failure causes (Claude error, push conflict, quota), only push conflict is provably safe
      to resume cheaply (rebase + retry push, no re-run of Claude) since the code itself was already
      correct; Claude error and quota exhaustion leave unknown partial state, so reset-and-restart
      remains the only sound option for those. Offered a choice: split handling by failure type
      (push-conflict = rebase+retry-push, not counted against the 2 retries; other failures =
      reset-and-restart, counted) versus keeping it simple (reset-and-restart uniformly for all
      three failure causes, accepting the extra token cost on push-conflict as the price of
      simplicity).]

      User chose: reset-and-restart uniformly for all failure causes (accepted the extra token cost
      on push-conflict in exchange for simplicity - no failure-type branching in v1).
