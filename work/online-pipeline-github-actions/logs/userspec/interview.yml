  edge_cases:
    score: 85
    value: |
      Multiple features in parallel on the same repo (two issues opened close together) must be
      supported in this upgrade, not deferred. Each feature keeps its own branch
      (`userspec/{slug}`) and its own `concurrency:` group keyed by issue number, so two issues'
      jobs do not block or clobber each other. Finalize (Project Knowledge update, archiving
      work/{feature}) is in scope, confirmed as the one place two parallel features could still
      conflict by editing the same Project Knowledge file. Finalize triggers automatically on
      `pull_request: closed` with `merged=true` (no extra confirm step). All finalize jobs share one
      fixed `concurrency:` group (e.g. `finalize-project-knowledge`) so concurrent merges finalize
      one at a time instead of racing on the same Project Knowledge files.

      The spec PR and the code PR both merge into main via the same event type, so they are
      distinguished by branch/label: spec PR uses branch `userspec/{slug}` + label `userspec-spec`;
      code PR uses branch `feature/{slug}` + label `userspec-implement`. Finalize's trigger filters
      to the code-PR label/branch only, so merging the spec PR (at approve time) never fires
      finalize prematurely.

      Every job triggered by `issue_comment: created` filters out comments authored by the bot
      itself (e.g. `github.event.comment.user.type != 'Bot'`), since the bot posts its own comment
      after nearly every stage (question, notification, failure, decision-pause) and must not
      re-trigger on its own output.
