      merge), không sửa `on:` logic của workflow YAML: local→online đẩy đúng branch
      (`userspec/{slug}` hoặc `feature/{slug}`) lên remote kèm trạng thái hiện tại, rồi đăng comment
      token riêng `/switch-online` lên issue để "đánh thức" automation (ở ranh giới giai đoạn, dựng
      đúng PR+label cần thiết để cơ chế approve/merge có sẵn tự kích hoạt tiếp). Online→local: skill
      tự fetch/checkout đúng branch, đọc status marker/interview.yml, báo rõ đang dở ở đâu để tiếp
