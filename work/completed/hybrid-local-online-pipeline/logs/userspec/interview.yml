      - Giữa lúc đang trả lời dở 1 batch câu hỏi interview ở local, switch sang online → branch
        `userspec/{slug}` được push với interview.yml hiện tại, comment `/switch-online` được đăng
        → job GitHub Actions tiếp tục đúng từ điểm dở, không hỏi lại câu đã trả lời.
      - Giữa lúc code-writing đang implement dở ở local, switch sang online → branch
        `feature/{slug}` được push với code hiện tại, comment `/switch-online` kích hoạt
        implement-resume online tiếp tục từ đúng chỗ (không làm lại từ đầu).
      - Ở ranh giới giai đoạn (spec approved local chưa từng lên GitHub, hoặc implement xong local),
        switch-to-online dựng đúng PR+label cần thiết (`userspec-spec` hoặc `userspec-implement`)
        để cơ chế approve/merge có sẵn của online-pipeline tự kích hoạt tiếp — không sửa trigger
        YAML nào.
      - Chiều ngược: đang dở trên GitHub (interview qua comment, hoặc implement, có thể đang
        `awaiting_decision`) → switch-to-local → skill tự fetch/checkout đúng branch, đọc trạng
        thái, báo rõ "đang dở ở đâu, câu hỏi gì chưa trả lời" để tiếp tục ngay trong chat.
      - Feature hoàn tất hoàn toàn ở local (chưa từng switch online) → issue placeholder tự đóng
        khi finalize xong.
      - Conflict khi push lúc switch (remote có commit mới local không có) → skill tự fetch+merge/
        rebase nếu sạch; nếu conflict thật, đưa ra cho user tự xử lý trong chat, không tự đoán.
    gaps: []
    required: true

  constraints:
    score: 90
    value: |
      - Chỉ áp dụng hành vi "tạo issue ngay từ đầu + slug theo issue" cho project đã bật
        online-pipeline; project không bật giữ nguyên Start path hiện tại (tự chọn slug).
      - Hành vi "tự tạo issue" CHỈ kích hoạt khi Start path được gọi MÀ KHÔNG có slug nào được
        truyền sẵn (người dùng gõ tương tác ở local, chưa có slug) — khi `online-pipeline` tự gọi
        Start path TỪ BÊN TRONG GitHub Actions job (stage `userspec-turn`, đã luôn gọi kèm slug có
        sẵn, "không để Start path tự chọn", theo đúng hợp đồng hiện có không đổi) thì bỏ qua hoàn
        toàn nhánh tạo issue mới, dùng slug được cho như cũ. Không cần tín hiệu mới — tái dùng
        đúng phân biệt "có slug sẵn hay không" mà hợp đồng hiện tại đã có. Thiếu điều kiện này sẽ
        khiến mọi lần online-pipeline tự gọi Start path (kể cả lần đầu hoàn toàn bình thường,
        không liên quan hybrid switch) tự tạo thêm 1 issue thừa khác, phá vỡ luồng online-pipeline
        gốc.
      - Không sửa trigger logic (`on:` conditions) của workflow YAML hiện có — chỉ thêm nhận diện
        literal token `/switch-online` trong nội dung comment (cùng cơ chế với
        `ONLINE_PIPELINE_AUTOMATED`), tái dùng nguyên `issue_comment`/`pull_request merge` đã có.
      - Gắn thẳng vào `online-pipeline/SKILL.md` (thêm section mới cho audience "local user muốn
        switch"), không tạo skill riêng.
      - `code-writing` không có git/commit discipline nội tại — switch-to-online giữa implement
        phải tự áp đặt kỷ luật commit/push từ ngoài (switch skill làm, giống cách
        `online-pipeline/SKILL.md` đã áp đặt cho automated runs); local tương tác bình thường thì
        không cần vì không có nhu cầu resume.
      - Feature làm hoàn toàn local tới giữa implement (chưa từng có PR/branch thật trên GitHub) khi
        switch: bỏ qua bước dựng lại PR-spec-review hình thức, đẩy thẳng `feature/{slug}` kèm code
        dở lên.
      - Không xử lý race condition giữa 2 lần switch liên tiếp (switch online rồi đổi ý switch ngay
        về local trước khi job GitHub Actions kịp chạy xong) — last-write-wins, chấp nhận rủi ro
        hãn hữu cho v1, không thêm cơ chế khóa status marker.
      - Máy local chưa cài/chưa auth `gh` CLI khi bắt đầu feature mới (project bật online-pipeline)
        → báo lỗi dừng, yêu cầu cấu hình `gh` trước, không fallback âm thầm về hành vi tự chọn slug.
      - Conflict push khi switch: tự `fetch`+thử `merge`/`rebase`; nếu merge sạch thì tự push tiếp;
        nếu conflict thật, dừng và đưa conflict ra cho user tự xử lý trong chat (không tự chọn bên
        thắng).
      - Feature hoàn tất ở local (bất kỳ lịch sử switch) → issue placeholder tự đóng (`gh issue
        close`) khi finalize chạy local xong; finalize chạy online giữ nguyên hành vi cũ (ngoài
        phạm vi, không thêm auto-close ở đó).
      - Tạo issue placeholder lúc Start local phải gắn kèm label `local-placeholder` ngay lúc tạo.
        Route job của `online-pipeline-userspec.yml` (sửa điều kiện nội bộ, không đổi `on:` event)
        bỏ qua xử lý cho **mọi** event (cả `issues: opened` và `issue_comment: created`) khi issue
        còn label này — tránh race giữa automation và phiên interview/implement đang chạy ở local,
        kể cả khi userspec làm hoàn toàn local rồi mới switch ở giai đoạn implement. Label được gỡ
        bất kể switch-to-online xảy ra ở giai đoạn nào (userspec hay implement), không chỉ riêng
        lúc switch ở userspec.
      - [Sửa chính xác lại sau validation round 1 — skeptic phát hiện mô tả sai cấu trúc logic
        thật] Logic phát hiện "userspec đã xong" thật của route job KHÔNG phải 2 dấu hiệu OR phẳng
        — là nested if/else: nếu branch `userspec/{slug}` KHÔNG tồn tại → đọc `status: approved`
        từ `work/{slug}/user-spec.md` trên default branch (main) → approved thì skip, chưa thì
        start; nếu branch TỒN TẠI → checkout branch đó, đọc `status: approved` TỪ CHÍNH BRANCH đó
        → approved thì skip, chưa thì continue. Bản thân "branch tồn tại" không phải dấu hiệu
        "xong" — ngược lại, case bình thường (branch tồn tại, chưa approved) nghĩa là "đang dở",
        phải trả về continue. Dấu hiệu thứ 3 (`feature/{slug}` tồn tại) phải được chèn vào ĐÚNG
        nhánh "branch `userspec/{slug}` KHÔNG tồn tại" (song song với check `status: approved` trên
        main) — vì case bypass chính là case branch đó không tồn tại — KHÔNG được gộp thành 1 OR
        phẳng với "branch tồn tại", nếu không sẽ phá luồng continue bình thường. Không dựa vào
        việc gỡ label `local-placeholder` để suy luận "userspec đã xong" — label chỉ dùng để chặn
        race tạm thời lúc chưa switch, không phải tín hiệu hoàn thành.
      - Label `local-placeholder` (mới, chưa tồn tại trong project nào đã bật online-pipeline từ
        trước) phải được tạo defensively giống đúng cách 2 label hiện có (`userspec-spec`,
        `userspec-implement`) đã làm: thêm vào `setup-online-pipeline.sh` (tạo 1 lần lúc setup) VÀ
        kiểm tra/tạo inline ngay trước khi dùng (`gh label list ... | grep -qx local-placeholder
        || gh label create local-placeholder`) ở chỗ switch-skill/Start path gọi `gh issue create
        --label local-placeholder` — để không lỗi "label not found" trên project đã bật
        online-pipeline từ trước khi feature này tồn tại.
      - Thứ tự bắt buộc khi switch-to-online (ở userspec hoặc implement): gỡ label
        `local-placeholder` TRƯỚC, rồi mới đăng comment `/switch-online` SAU — route job đọc trạng
        thái label từ snapshot payload của chính event comment đó; nếu đăng comment trước, sự kiện
        đó vẫn thấy label còn, bị bỏ qua nhầm.
      - `/switch-online` là token dự trữ: bất cứ khi nào là comment kích hoạt 1 stage, KHÔNG BAO
        GIỜ được coi là nội dung trả lời/trạng thái đã có (áp dụng đồng nhất cho cả userspec-turn
        và implement-resume, không chỉ 1 trong 2):
        - `online-pipeline/SKILL.md` stage `userspec-turn` Resume path (bước 3 hiện có: "coi
          comment mới nhất là câu trả lời user, append vào interview loop") cần thêm nhánh: nếu
          comment kích hoạt là `/switch-online`, KHÔNG append làm câu trả lời — chỉ tiếp tục
          interview loop bình thường (tìm gap đang dở trong `interview.yml` đã push, đăng câu hỏi
          tiếp theo như 1 comment mới). Câu trả lời thật của user luôn là 1 comment riêng, đến sau.
        - Stage `implement-resume` cần thêm nhánh: nếu comment kích hoạt chính là `/switch-online`
          (dấu hiệu duy nhất — không dựa vào có/không có status marker, vì marker luôn được tạo
          sẵn) → chạy đúng như bước 1 của stage `implement` gốc (đọc spec/decisions đã duyệt,
          implement bằng `code-writing` trên repo hiện tại), không ép buộc coi comment đó là câu
          trả lời cho câu hỏi không tồn tại.
      - Switch-to-online giữa implement, lần đầu push `feature/{slug}` lên remote (branch chưa từng
        tồn tại online) phải tự khởi tạo file status marker
        `work/{slug}/logs/working/online-pipeline-status.yml` với **`status: awaiting_decision`**
        (không phải `in_progress`) — đây là giá trị chính xác route job thật của
        `online-pipeline-implement.yml` cần (`grep -q '^status: awaiting_decision'`) để dispatch
        job khi có comment, tái dùng đúng gate có sẵn, không cần sửa YAML. Nếu branch đã tồn tại
        online từ trước (status marker đã có, bất kể giá trị gì) thì không ghi đè.
      - [Sửa sau validation round 2 — adequacy phát hiện race window] Route job thật của
        `online-pipeline-implement.yml` dispatch dựa THUẦN vào "branch tồn tại + marker ==
        awaiting_decision", KHÔNG đọc nội dung comment — nhận diện `/switch-online` chỉ xảy ra bên
        trong stage prompt, SAU khi job đã dispatch. Nếu bước đăng comment `/switch-online` thất
        bại SAU KHI branch+marker `awaiting_decision` đã push thành công: switch-to-online phải tự
        revert marker về trạng thái không kích hoạt dispatch (hoặc xoá branch nếu đây là lần đầu
        tạo) — không để GitHub ở trạng thái "sẵn sàng dispatch" treo vô thời hạn chờ 1 comment có
        thể không bao giờ tới, vì bất kỳ comment nào khác lỡ xuất hiện trong lúc đó sẽ bị hiểu
        nhầm thành câu trả lời giả. Trường hợp thành công bình thường (push rồi comment ngay sau,
        không lỗi) vẫn còn 1 khoảng hở rất nhỏ do độ trễ mạng — chấp nhận là rủi ro hãn hữu v1,
        không xây cơ chế khóa/giao dịch phức tạp hơn.
      - [Chấp nhận hạn chế, sau validation round 2 — adequacy] Nếu người dùng switch-to-online
        (tạo branch/PR online) rồi switch-to-local và hoàn tất toàn bộ phần còn lại ở local mà
        không merge PR đó: branch/PR online đó bị bỏ lại mở, KHÔNG có cơ chế tự dọn (đóng PR/xoá
        branch). Hạn chế đã biết, chấp nhận cho v1.
      - [Mới, sau validation round 2 — quality] Cú pháp kích hoạt switch ở LOCAL (khác
        `/switch-online` — token đó chỉ dùng phía GitHub comment): thêm cụm trigger ngôn ngữ tự
        nhiên vào "Use when" của frontmatter `online-pipeline/SKILL.md`, gồm ít nhất "chuyển
        feature này lên online" (và cụm tương ứng cho chiều ngược, "chuyển feature này về local"),
        theo đúng cách routing bằng ngôn ngữ tự nhiên mà mọi skill khác trong project đang dùng —
        không phải slash-command.
      - [Chấp nhận hạn chế + cảnh báo, sau validation round 2 — quality] Phát hiện "project có bật
        online-pipeline" chỉ dựa vào sự tồn tại của file workflow đã vendor — không phát hiện được
        từ file liệu secrets/GitHub App đã cấu hình xong chưa (không khả thi kỹ thuật, theo
        `code-research.md`). Trên project đã vendor nhưng chưa setup xong, mọi feature local mới
        vẫn tạo issue thật dù switch chưa thể hoạt động — chấp nhận là hạn chế đã biết, Start path
        in thêm 1 dòng cảnh báo ngắn lúc tạo issue đầu tiên ("nếu chưa hoàn tất setup
        online-pipeline, issue này sẽ không được xử lý cho tới khi xong"), không xây cơ chế phát
        hiện mới.
      - Switch-to-local: trước khi checkout branch remote, kiểm tra working tree local có thay đổi
        chưa commit; nếu có → dừng, báo lỗi rõ, bắt user tự commit/stash trước khi switch tiếp tục
        (không tự động stash hộ).
    gaps: []
    required: true

  testing_strategy:
    score: 85
    value: |
      Không viết unit test tự động cho phần orchestration (bash/`gh`/`git` + sửa
