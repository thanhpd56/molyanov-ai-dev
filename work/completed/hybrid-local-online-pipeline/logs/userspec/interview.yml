        động post lên issue trong lúc user đang làm interview hoặc implement ở local.
      - [ ] Switch-to-online (ở userspec HOẶC implement) gỡ label `local-placeholder` khỏi issue
        TRƯỚC khi đăng comment `/switch-online`, như một phần của hành động switch — kể cả khi
        userspec làm hoàn toàn local và switch chỉ xảy ra lần đầu ở giữa implement.
      - [ ] Feature làm hoàn toàn local qua hết userspec rồi switch-to-online giữa implement →
        comment `/switch-online` không bị workflow userspec xử lý nhầm, kể cả ở các comment SAU
        comment switch đầu tiên (vd câu trả lời cho 1 `awaiting_decision` lúc implement online) —
