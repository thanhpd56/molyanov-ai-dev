    value: |
      - `gh` CLI chưa cài/chưa auth lúc Start feature mới (project bật online-pipeline) → báo lỗi
        rõ, dừng ngay, không tạo feature folder hoặc issue dở.
      - Push conflict khi switch (remote có commit mới local chưa có) → tự fetch+merge/rebase; nếu
        tự merge được thì tiếp tục push; nếu conflict thật (không tự merge) → dừng, hiển thị conflict
        cho user tự xử lý trong chat, không tự chọn bên thắng.
      - Lỗi kỹ thuật khi đăng comment `/switch-online` (vd mất mạng, quyền `gh` không đủ) SAU KHI
        branch+marker đã push thành công → dừng, báo lỗi rõ, không coi switch là đã thành công, VÀ
        tự revert marker (hoặc xoá branch nếu lần đầu tạo) về trạng thái không kích hoạt dispatch —
        không để GitHub ở trạng thái "sẵn sàng dispatch" treo chờ 1 comment có thể không bao giờ
        tới (route job thật dispatch chỉ dựa branch+marker, không đọc nội dung comment, nên để
        marker ở `awaiting_decision` mà không có comment đúng sẽ khiến bất kỳ comment khác lỡ xuất
        hiện bị hiểu nhầm thành câu trả lời giả).
      - Nếu bước revert ở trên (sau khi đăng comment thất bại) CŨNG thất bại (vd mạng vẫn mất ngay
        lúc đó) → không retry loop phức tạp; báo lỗi to, rõ ràng, kèm hướng dẫn khắc phục tay cụ
        thể (vd branch `feature/{slug}` có thể đang kẹt ở trạng thái `awaiting_decision` giả — tự
        xoá branch hoặc sửa file status marker trên GitHub trước khi dùng lại issue đó); chấp nhận
        là rủi ro hãn hữu v1 (double-failure mạng liên tiếp).
      - `gh issue close` thất bại lúc finalize local hoàn tất → finalize local vẫn coi là thành công
        (archive `work/{feature}` vẫn xảy ra), chỉ log/báo không đóng được issue, không rollback
        finalize vì lỗi phụ này.
      - Switch-to-local khi working tree local đang có thay đổi chưa commit → dừng ngay trước khi
        checkout, báo lỗi rõ yêu cầu user tự commit/stash, không tự động stash hộ và không checkout
        đè lên thay đổi chưa lưu.
