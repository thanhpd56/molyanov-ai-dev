  risks:
    score: 85
    value: |
      - **Risk 1:** Tạo issue ngay từ đầu cho MỌI feature local (kể cả feature chắc chắn chỉ làm
        local) gây nhiễu issue tracker nếu project có nhiều feature nhỏ. **Mitigation:** issue tự
        đóng khi finalize local hoàn tất; user đã xác nhận chấp nhận đánh đổi này để đổi lấy khả
        năng switch tức thời bất kỳ lúc nào.
      - **Risk 2:** `issue_comment` là trigger "nghe mọi comment không phải bot" vốn đã có sẵn —
        thêm token `/switch-online` giảm nguy cơ 1 comment thường bị hiểu nhầm thành lệnh switch,
        nhưng không loại trừ hoàn toàn (user tự gõ nhầm chuỗi đó trong 1 comment thường).
        **Mitigation:** chấp nhận rủi ro nhỏ này, nhất quán với cách `ONLINE_PIPELINE_AUTOMATED`
        đã được xử lý (so khớp literal string, không suy luận ý định).
      - **Risk 3:** Switch giữa implement khi feature làm hoàn toàn local (bỏ qua PR-spec-review
        hình thức) đồng nghĩa online không có bước review spec nào trước khi implement tiếp.
        **Mitigation:** chấp nhận vì spec đã được tự duyệt ở local qua đúng luồng
        `user-spec-planning` Step 6 (Obtain Approval) trước đó rồi.
      - **Risk 4:** Race condition khi switch 2 lần liên tiếp nhanh có thể làm mất 1 phần cập nhật
        (last-write-wins). **Mitigation:** chấp nhận là hạn chế v1, hãn hữu trong thực tế dùng solo.
      - **Risk 5:** Route job thật của `online-pipeline-implement.yml` dispatch chỉ dựa
        branch+marker, không đọc nội dung comment — ngay cả khi switch-to-online thành công bình
        thường (không lỗi), vẫn còn 1 khoảng hở rất nhỏ (độ trễ mạng giữa lúc push và lúc comment
        lên được issue) mà 1 comment khác lỡ xuất hiện trong lúc đó có thể bị hiểu nhầm.
        **Mitigation:** chấp nhận là rủi ro hãn hữu v1 (cùng loại với Risk 4); trường hợp đăng
        comment THẤT BẠI (không chỉ trễ) được xử lý triệt để hơn bằng cách tự revert marker/branch
        (xem Error Scenarios/Constraints).
      - **Risk 6:** Switch online rồi quay về local hoàn tất, không merge PR online đã tạo → PR/
        branch đó bị bỏ lại mở mãi, không được dọn. **Mitigation:** chấp nhận là hạn chế v1, người
        dùng tự đóng/xoá tay nếu cần.
      - **Risk 7:** Phát hiện "project có bật online-pipeline" chỉ dựa file workflow đã vendor tồn
        tại, không phát hiện được secrets/GitHub App đã cấu hình xong chưa — project vendor nhưng
        chưa setup xong vẫn tự tạo issue thật dù switch chưa thể hoạt động. **Mitigation:** chấp
        nhận hạn chế (không khả thi kỹ thuật để phát hiện từ file repo), thêm 1 dòng cảnh báo ngắn
        lúc tạo issue đầu tiên nhắc user hoàn tất setup.
      - **Risk 8:** [Ghi lại quyết định đã chốt từ sớm, chưa từng được đưa vào Risks trước đây —
        phát hiện lại ở validation round 3, quality] Switch-to-local KHÔNG tự đổi/re-arm lại label
        `local-placeholder` hay bất kỳ cơ chế chặn nào sau khi quay về local — nếu lỡ có comment
        khác (bot, collaborator, hay chính user) xuất hiện trên issue trong lúc đang làm local sau
        1 vòng switch-to-online→switch-to-local, route job (dispatch chỉ dựa branch+marker, không
        có tín hiệu "đang có người làm local") vẫn có thể bị kích hoạt nhầm. **Mitigation:** chấp
        nhận bỏ qua race-condition này cho v1 (quyết định đã chốt từ đầu interview) — hãn hữu trong
        thực tế dùng solo, không xây cơ chế khóa/re-arm phức tạp hơn.
      - **Risk 9:** Nếu bước revert (khi đăng comment `/switch-online` thất bại) CŨNG thất bại (vd
        mạng vẫn mất ngay lúc đó) → branch bị kẹt lại đúng trạng thái nguy hiểm mà cơ chế revert
        được tạo ra để tránh. **Mitigation:** không thêm retry loop phức tạp — báo lỗi to, rõ
        ràng, kèm hướng dẫn khắc phục tay cụ thể (vd tự xoá branch hoặc sửa status marker trên
        GitHub trước khi dùng lại issue đó); chấp nhận là rủi ro hãn hữu v1 (double-failure mạng
        liên tiếp).
    gaps: []
    required: true

