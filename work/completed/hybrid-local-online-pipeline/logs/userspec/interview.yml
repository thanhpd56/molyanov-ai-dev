      mới của `user-spec-planning` (phần tạo issue) đúng vị trí, không đổi hành vi project không
      bật online-pipeline.
      User verification: chạy thử thật trên 1 repo demo có bật online-pipeline — switch cả 2 chiều,
      giữa chừng và ở ranh giới, cho cả 3 giai đoạn, cố ý tạo conflict push để xác nhận
      fetch+merge/rebase hoạt động và conflict thật được đưa ra đúng cách.
