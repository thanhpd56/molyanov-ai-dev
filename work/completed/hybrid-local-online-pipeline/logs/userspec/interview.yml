      Mở rộng `online-pipeline/SKILL.md` (không tạo skill riêng) với khả năng "switch" 2 chiều giữa
      local (Claude Code CLI) và online (GitHub Actions), ở cả 3 giai đoạn (userspec, implement,
      finalize), bao gồm cả giữa chừng 1 giai đoạn (không chỉ ở ranh giới). Với mọi project đã bật
      online-pipeline, Start path của `user-spec-planning` đổi hẳn: luôn tạo 1 GitHub issue rỗng
      ngay từ đầu, slug = kebab(issue title)+issue number (giống naming contract online hiện có),
      thay cho việc tự chọn slug như hiện tại — áp dụng cho MỌI feature local, kể cả feature không
      bao giờ switch sang online.
