         tồn tại — không phát hiện được từ file liệu secrets/GitHub App đã cấu hình xong chưa.
         Project đã vendor nhưng chưa setup xong: mọi feature local mới vẫn tạo issue thật dù
         switch chưa thể hoạt động. Đề xuất: chấp nhận hạn chế đã biết (ghi Risk mới) + thêm 1
         dòng cảnh báo ngắn lúc tạo issue đầu tiên ("nếu chưa hoàn tất setup online-pipeline, issue
         này sẽ không được xử lý cho tới khi xong") — không xây cơ chế phát hiện mới (không khả
         thi kỹ thuật). Đồng ý không?
    user_answer: |
      1 chấp nhận
      2 chấp nhận hạn chế
      3. chuyển feature này lên online
      4. thêm cảnh báo thôi.

