name: Online Pipeline - User Spec

# Covers user-spec-planning Steps 1-5 (interview, completeness check, draft, validate) plus the
# "/approve" PR-merge handoff that replaces Step 6 for this pipeline. See
# skills/online-pipeline/SKILL.md for the naming contract and per-stage agent instructions.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  route:
    if: github.event_name == 'issues' || github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.route.outputs.action }}
      slug: ${{ steps.route.outputs.slug }}
      branch: ${{ steps.route.outputs.branch }}
      pr_number: ${{ steps.route.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine stage
        id: route
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          slugify() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40
          }

          if [ "$IS_PR_COMMENT" = "true" ]; then
            if [ "$COMMENT_BODY" != "/approve" ]; then
              echo "action=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PR_NUMBER="$ISSUE_NUMBER"
            LABELS="$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name')"
            STATE="$(gh pr view "$PR_NUMBER" --json state -q '.state')"
            if [ "$STATE" != "OPEN" ] || ! printf '%s\n' "$LABELS" | grep -qx "userspec-spec"; then
              echo "action=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            BRANCH="$(gh pr view "$PR_NUMBER" --json headRefName -q '.headRefName')"
            SLUG="${BRANCH#userspec/}"
            echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "action=approve" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SLUG="$(slugify "$ISSUE_TITLE")-${ISSUE_NUMBER}"
          BRANCH="userspec/$SLUG"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "issues" ]; then
            echo "action=start" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # No spec branch yet for this issue number: either truly new (issues:opened was
            # missed) or this issue already passed the spec phase (branch was deleted on merge).
            if [ -f "work/$SLUG/user-spec.md" ] && grep -q '^status: approved' "work/$SLUG/user-spec.md"; then
              echo "action=skip" >> "$GITHUB_OUTPUT"
            else
              echo "action=start" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          if [ -f "work/$SLUG/user-spec.md" ] && grep -q '^status: approved' "work/$SLUG/user-spec.md"; then
            echo "action=skip" >> "$GITHUB_OUTPUT"
          else
            echo "action=continue" >> "$GITHUB_OUTPUT"
          fi

  approve:
    needs: route
    if: needs.route.outputs.action == 'approve'
    runs-on: ubuntu-latest
    # Keyed by slug (not issue number): a PR comment's github.event.issue.number is the PR's own
    # number, different from the originating issue's — keying by issue number would let an
    # approve run and a same-feature "continue" run (triggered by a comment on the issue itself)
    # race on the same userspec/{slug} branch. route derives slug the same way for both event
    # shapes, so this group matches the userspec job's group below for the same feature.
    concurrency:
      group: online-pipeline-userspec-${{ needs.route.outputs.slug }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.route.outputs.branch }}

      - name: Mark the spec approved
        env:
          SLUG: ${{ needs.route.outputs.slug }}
          # Routed through env, not interpolated into the script body: this PR's headRefName is
          # attacker-reachable (anyone who can open a PR controls it) and, unlike SLUG, is not
          # restricted to a safe character set — a crafted branch name interpolated directly here
          # would be arbitrary shell execution in the one job that later holds GH_PAT.
          BRANCH: ${{ needs.route.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.email "online-pipeline[bot]@users.noreply.github.com"
          git config user.name "online-pipeline[bot]"
          sed -i 's/^status: draft$/status: approved/' "work/$SLUG/user-spec.md"
          sed -i 's/status: "in_progress"/status: "completed"/' "work/$SLUG/logs/userspec/interview.yml"
          git add "work/$SLUG/user-spec.md" "work/$SLUG/logs/userspec/interview.yml"
          git commit -m "chore(userspec): approve user-spec for $SLUG"
          git push origin "HEAD:$BRANCH"

      - name: Merge the spec PR
        env:
          # Must be a PAT, not GITHUB_TOKEN: GitHub does not let the default token's actions
          # trigger other workflow runs, and this merge must trigger online-pipeline-implement.yml.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh pr merge "${{ needs.route.outputs.pr_number }}" --merge --delete-branch

  userspec:
    needs: route
    if: needs.route.outputs.action == 'start' || needs.route.outputs.action == 'continue'
    runs-on: ubuntu-latest
    concurrency:
      group: online-pipeline-userspec-${{ needs.route.outputs.slug }}
      cancel-in-progress: false
    env:
      SLUG: ${{ needs.route.outputs.slug }}
      BRANCH: ${{ needs.route.outputs.branch }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout or create the spec branch
        run: |
          set -euo pipefail
          git config user.email "online-pipeline[bot]@users.noreply.github.com"
          git config user.name "online-pipeline[bot]"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          mkdir -p "work/$SLUG/logs/working"
          printf 'status: in_progress\n' > "work/$SLUG/logs/working/online-pipeline-status.yml"

      - name: Select Claude auth method
        run: |
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "Using Claude subscription OAuth token"
          elif [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "Using Anthropic API key"
          else
            echo "::error::Set either CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as a repo secret"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run userspec-turn
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ACTION: ${{ needs.route.outputs.action }}
        run: |
          set -euo pipefail
          PROMPT_FILE="$(mktemp)"
          {
            echo "Use the online-pipeline skill (skills/online-pipeline/SKILL.md), stage \"userspec-turn\"."
            echo "Issue: #$ISSUE_NUMBER"
            echo "Feature slug: $SLUG"
            echo "Feature folder: work/$SLUG"
            echo "Branch: $BRANCH"
            echo ""
            if [ "$ACTION" = "start" ]; then
              echo "This is the first run for this issue. Issue body (initial task description):"
              echo "$ISSUE_BODY"
            else
              echo "Latest issue comment (treat as the newest user answer):"
              echo "$COMMENT_BODY"
            fi
            echo ""
            echo "ONLINE_PIPELINE_AUTOMATED"
          } > "$PROMPT_FILE"
          claude -p "$(cat "$PROMPT_FILE")" --dangerously-skip-permissions

      - name: Open or update the spec PR
        run: |
          set -euo pipefail
          STATUS="$(grep -oP '(?<=^status: ).*' "work/$SLUG/logs/working/online-pipeline-status.yml" 2>/dev/null || echo in_progress)"
          git push origin "HEAD:$BRANCH" || true
          if [ "$STATUS" != "ready_for_review" ]; then
            exit 0
          fi
          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' || true)"
          if [ -z "$EXISTING" ]; then
            gh label list --json name -q '.[].name' | grep -qx userspec-spec || gh label create userspec-spec --description "online-pipeline" --color "0E8A16"
            gh pr create --base main --head "$BRANCH" \
              --title "user-spec: $SLUG" \
              --body "Auto-generated by online-pipeline. Review work/$SLUG/user-spec.md, then comment /approve on this PR to continue." \
              --label userspec-spec
          fi
          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          ISSUE_NUMBER="${SLUG##*-}"
          gh issue comment "$ISSUE_NUMBER" --body "Spec ready for review: #$PR_NUMBER. Comment \`/approve\` on that PR to continue."
