name: Online Pipeline - Knowledge Init

# Drives the initial Project Knowledge interview for a whole repo (not a single feature) via
# documentation-writing's create-project-knowledge.md, one turn per issue comment (or once on
# issue open), for any issue carrying the knowledge-init label. Commits straight to main every
# turn — there is no branch for this stage. See skills/online-pipeline/SKILL.md, Stage:
# knowledge-init, for the per-turn agent instructions.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  # Shared, fixed group with finalize (not a group of its own): both stages commit straight to
  # main and can both touch Project Knowledge, so they must never run in parallel on the same repo.
  group: online-pipeline-finalize
  cancel-in-progress: false

jobs:
  knowledge-init:
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'knowledge-init') &&
      (github.event_name == 'issues' || github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SLACK_RELAY_TOKEN: ${{ secrets.SLACK_RELAY_TOKEN }}
      SLACK_WORKER_URL: ${{ secrets.SLACK_WORKER_URL }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Select Claude auth method
        run: |
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "Using Claude subscription OAuth token"
          elif [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "Using Anthropic API key"
          else
            echo "::error::Set either CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as a repo secret"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Codex sync tooling
        # create-project-knowledge.md's "Write the Documentation" step writes under .claude/** and
        # CLAUDE.md on its final turn, which needs ~/.claude/scripts/sync-to-codex.sh exactly like
        # documentation-writing's Feature Finalization Mode does in online-pipeline-finalize.yml —
        # that script only exists on a developer's own machine, never on a bare CI runner.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.claude/scripts"
          curl -fsSL -o "$HOME/.claude/scripts/sync-to-codex.py" \
            https://raw.githubusercontent.com/thanhpd56/molyanov-ai-dev/main/scripts/sync-to-codex.py
          curl -fsSL -o "$HOME/.claude/scripts/sync-to-codex.sh" \
            https://raw.githubusercontent.com/thanhpd56/molyanov-ai-dev/main/scripts/sync-to-codex.sh
          chmod +x "$HOME/.claude/scripts/sync-to-codex.sh"

      - name: Run knowledge-init turn with retry
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          git config user.email "online-pipeline[bot]@users.noreply.github.com"
          git config user.name "online-pipeline[bot]"

          relay_to_slack() {
            local issue_number="$1" text="$2"
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 0
            fi
            local issue_body channel_id thread_ts
            issue_body="$(gh issue view "$issue_number" --json body -q .body)"
            channel_id="$(printf '%s' "$issue_body" | grep -oP '(?<=channel_id=)\S+' || true)"
            thread_ts="$(printf '%s' "$issue_body" | grep -oP '(?<=thread_ts=)\S+' || true)"
            if [ -z "$channel_id" ]; then
              return 0
            fi
            curl -fsS -X POST "$SLACK_WORKER_URL/relay" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg c "$channel_id" --arg t "$thread_ts" --arg x "$text" \
                    '{channel_id:$c, thread_ts:$t, text:$x}')" || true
          }

          # Rate-limit auto-switch (control-plane token pool) — see online-pipeline-implement.yml's
          # identical helper for the full rationale (Risk 1 fixed-string matching, fail-open on any
          # non-"no_alias_available" Worker outcome).
          try_rate_limit_switch() {
            if ! grep -qF "You've hit your session limit" "$CLAUDE_OUTPUT_FILE" \
               && ! grep -qF "You've hit your weekly limit" "$CLAUDE_OUTPUT_FILE"; then
              return 1
            fi
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 1
            fi
            local reset_text resp ok err
            reset_text="$(grep -oP "resets .*\)" "$CLAUDE_OUTPUT_FILE" | tail -1 || true)"
            resp="$(curl -fsS -X POST "$SLACK_WORKER_URL/switch-token/auto" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg o "${GITHUB_REPOSITORY%%/*}" --arg r "${GITHUB_REPOSITORY##*/}" --arg t "$reset_text" \
                    '{owner:$o, repo:$r, rateLimitResetText:$t}')" 2>/dev/null || true)"
            ok="$(printf '%s' "$resp" | jq -r '.ok // false' 2>/dev/null || echo false)"
            if [ "$ok" = "true" ]; then
              CURRENT_TOKEN="$(printf '%s' "$resp" | jq -r '.token')"
              echo "Rate limit detected — switched to pool alias $(printf '%s' "$resp" | jq -r '.alias')."
              return 0
            fi
            err="$(printf '%s' "$resp" | jq -r '.error // ""' 2>/dev/null || echo "")"
            if [ "$err" = "no_alias_available" ]; then
              SWITCH_EXHAUSTED=true
            fi
            return 1
          }

          BEFORE_SHA="$(git rev-parse HEAD)"
          # Comment count, not SHA — comments aren't git state. Stage knowledge-init is the one
          # exception to "the agent calls relay_to_slack itself" (see Slack Bridge above): in
          # production the agent reliably posts the gh issue comment but sometimes skips its own
          # relay_to_slack reproduction, so this loop mirrors every new comment deterministically
          # instead, regardless of which step inside the stage posted it.
          BEFORE_COMMENT_COUNT="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments | length')"
          ATTEMPTS=3
          RESULT="technical_error"
          CURRENT_TOKEN="${CLAUDE_CODE_OAUTH_TOKEN:-}"

          for ATTEMPT in 1 2 3; do
            echo "knowledge-init attempt $ATTEMPT/$ATTEMPTS"

            PROMPT_FILE="$(mktemp)"
            {
              echo "Use the online-pipeline skill (.claude/skills/online-pipeline/SKILL.md), stage \"knowledge-init\"."
              echo "Issue: #$ISSUE_NUMBER"
              echo ""
              if [ "$EVENT_NAME" = "issues" ]; then
                echo "This is the first run for this issue. Issue body:"
                echo "$ISSUE_BODY"
              else
                echo "Latest issue comment (treat as the newest user input):"
                echo "$COMMENT_BODY"
              fi
            } > "$PROMPT_FILE"

            CLAUDE_OUTPUT_FILE="$(mktemp)"
            set +e
            # SLACK_RELAY_TOKEN/SLACK_WORKER_URL deliberately blanked for this child process only
            # (the surrounding shell keeps the real values for the deterministic relay below) —
            # the agent must never self-relay (see SKILL.md), and a prose instruction alone proved
            # insufficient to guarantee that in production: this makes any self-relay attempt a
            # harmless no-op/401 instead of a real duplicate Slack post.
            CLAUDE_CODE_OAUTH_TOKEN="$CURRENT_TOKEN" SLACK_RELAY_TOKEN="" SLACK_WORKER_URL="" \
              claude -p "$(cat "$PROMPT_FILE")" --dangerously-skip-permissions 2>&1 | tee "$CLAUDE_OUTPUT_FILE"
            set -e

            AFTER_COMMENT_COUNT="$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments | length')"
            if [ "$AFTER_COMMENT_COUNT" -gt "$BEFORE_COMMENT_COUNT" ]; then
              # Filtered to this workflow's own gh issue comment calls — always authored as
              # "github-actions" (confirmed empirically via `gh issue view --json comments`; GitHub
              # does NOT render this login as "github-actions[bot]" in this API, despite that being
              # the common display name elsewhere) — never a human's GitHub comment or the Worker's
              # own mirror of a Slack reply (posted with a real user's GH_PAT), either of which
              # landing on the issue during this attempt's run window would otherwise get echoed
              # straight back into the same Slack thread.
              RELAY_COUNT=0
              while IFS= read -r COMMENT_JSON; do
                COMMENT_TEXT="$(printf '%s' "$COMMENT_JSON" | jq -r '.')"
                relay_to_slack "$ISSUE_NUMBER" "$COMMENT_TEXT"
                RELAY_COUNT=$((RELAY_COUNT + 1))
              done < <(gh issue view "$ISSUE_NUMBER" --json comments --jq ".comments[$BEFORE_COMMENT_COUNT:]" \
                        | jq -c '.[] | select(.author.login == "github-actions") | .body')
              echo "Relayed $RELAY_COUNT new bot comment(s) to Slack ($((AFTER_COMMENT_COUNT - BEFORE_COMMENT_COUNT)) new comment(s) total)."
            fi
            BEFORE_COMMENT_COUNT="$AFTER_COMMENT_COUNT"

            git fetch origin main
            AFTER_SHA="$(git rev-parse origin/main)"

            # The stage's own contract (see skills/online-pipeline/SKILL.md, Stage: knowledge-init)
            # guarantees every legitimate outcome commits something as its last action — including
            # the already-complete shortcut, which always refreshes interview.yml's timestamp even
            # on a repeat hit — so a landed commit is the only signal this loop trusts. It never
            # trusts issue/comment state, which an attempt can change before crashing.
            if [ "$AFTER_SHA" != "$BEFORE_SHA" ]; then
              RESULT="success"
              break
            fi

            echo "Technical failure on attempt $ATTEMPT (no commit landed on main)."
            if try_rate_limit_switch; then
              : # CURRENT_TOKEN updated above; falls through to the same reset-and-retry below.
            elif [ "${SWITCH_EXHAUSTED:-false}" = "true" ]; then
              RESULT="rate_limit_pool_exhausted"
              break
            fi
            if [ "$ATTEMPT" -lt "$ATTEMPTS" ]; then
              # main is never reset here: a failure before a commit leaves main untouched, so a
              # fresh checkout is enough — only this job's own local state is discarded.
              git reset --hard origin/main
              git clean -fd
            fi
          done

          echo "RESULT=$RESULT" >> "$GITHUB_ENV"

      - name: Report technical failure
        if: env.RESULT == 'technical_error'
        run: |
          relay_to_slack() {
            local issue_number="$1" text="$2"
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 0
            fi
            local issue_body channel_id thread_ts
            issue_body="$(gh issue view "$issue_number" --json body -q .body)"
            channel_id="$(printf '%s' "$issue_body" | grep -oP '(?<=channel_id=)\S+' || true)"
            thread_ts="$(printf '%s' "$issue_body" | grep -oP '(?<=thread_ts=)\S+' || true)"
            if [ -z "$channel_id" ]; then
              return 0
            fi
            curl -fsS -X POST "$SLACK_WORKER_URL/relay" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg c "$channel_id" --arg t "$thread_ts" --arg x "$text" \
                    '{channel_id:$c, thread_ts:$t, text:$x}')" || true
          }
          MESSAGE="knowledge-init job failed after 3 attempts (2 retries). Check the Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"
          relay_to_slack "$ISSUE_NUMBER" "$MESSAGE"
          exit 1

      - name: Report rate-limit pool exhausted
        if: env.RESULT == 'rate_limit_pool_exhausted'
        run: |
          relay_to_slack() {
            local issue_number="$1" text="$2"
            if [ -z "${SLACK_RELAY_TOKEN:-}" ] || [ -z "${SLACK_WORKER_URL:-}" ]; then
              return 0
            fi
            local issue_body channel_id thread_ts
            issue_body="$(gh issue view "$issue_number" --json body -q .body)"
            channel_id="$(printf '%s' "$issue_body" | grep -oP '(?<=channel_id=)\S+' || true)"
            thread_ts="$(printf '%s' "$issue_body" | grep -oP '(?<=thread_ts=)\S+' || true)"
            if [ -z "$channel_id" ]; then
              return 0
            fi
            curl -fsS -X POST "$SLACK_WORKER_URL/relay" \
              -H "X-Relay-Token: $SLACK_RELAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg c "$channel_id" --arg t "$thread_ts" --arg x "$text" \
                    '{channel_id:$c, thread_ts:$t, text:$x}')" || true
          }
          MESSAGE="Mọi token trong pool đều đang bị rate-limit, dừng tự động — thêm token mới qua /add-token hoặc đợi reset. Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"
          relay_to_slack "$ISSUE_NUMBER" "$MESSAGE"
          exit 1
